<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TALMUT</title>
<meta name="description" content="TALMUT — el juego de cartas de memoria, reflejos y faroles. Juega online o lleva la puntuación con tu baraja.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talmut">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter+Tight:wght@400;500;600;700;800;900&family=Saira:ital,wght@0,500;1,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0B0B0D; --navy2:#070708; --navy3:#140A0C; --deep:#040404; --rd:#C8202A; --rd2:#E8343E;
  --gold:#B8860B; --gold2:#D4A83A; --cream:#E8DCC8;
  --green:#6BBF7A; --red:#E06060; --blue:#E8494F; --purple:#A064C8;
  --txt:rgba(255,255,255,.88); --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.3);
  --line:rgba(184,134,11,.18);
  --fd:'Inter Tight','Helvetica Neue',Arial,sans-serif; --fb:'Inter Tight','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--fb);background:var(--navy);color:var(--txt);overflow-x:hidden;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit}
.screen{display:none;width:100%;max-width:430px;margin:0 auto;min-height:100dvh;background:linear-gradient(180deg,var(--navy2) 0%,var(--navy) 30%,var(--navy3) 100%);position:relative}
.screen.active{display:flex;flex-direction:column}

/* ---------- comunes ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 44px) 16px 10px}
.topbar .ttl{flex:1;text-align:center}
.topbar h1{margin:0;font-family:var(--fd);font-weight:700;font-size:17px;color:var(--cream);letter-spacing:3px}
.topbar p{margin:2px 0 0;font-family:var(--fb);font-size:12px;color:rgba(184,134,11,.65)}
.iconbtn{width:36px;height:36px;border:none;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:active{transform:scale(.94)}
.spacer36{width:36px;flex-shrink:0}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(184,134,11,.25),transparent)}
.btn{width:100%;padding:15px;border:none;border-radius:12px;cursor:pointer;font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.btn-gold{background:linear-gradient(135deg,var(--gold),#9A7209);color:#fff;box-shadow:0 3px 16px rgba(184,134,11,.25)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(184,134,11,.2);color:var(--txt);font-family:var(--fb);font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:none}
.btn-red{background:linear-gradient(135deg,#C84848,#A03030);color:#fff}
.btn-google{background:#fff;color:#222;font-family:var(--fb);font-weight:600;font-size:14px;letter-spacing:0;text-transform:none;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-sm{padding:10px 12px;font-size:12px}
.section-label{display:flex;align-items:center;gap:12px;margin:18px 0 10px}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(184,134,11,.2))}
.section-label::after{background:linear-gradient(90deg,rgba(184,134,11,.2),transparent)}
.section-label span{font-family:var(--fb);font-size:12px;color:rgba(184,134,11,.6);letter-spacing:2px;text-transform:uppercase}
.card-box{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px}
.muted{color:var(--dim);font-size:12px;line-height:1.5}
.pad{padding:0 20px}
.grow{flex:1}
.hidden{display:none!important}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border:none;background:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--dim)}
.seg button.on{background:rgba(184,134,11,.18);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(184,134,11,.35)}
.text-input{width:100%;padding:13px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(184,134,11,.25);border-radius:11px;color:var(--cream);font-family:var(--fb);font-size:15px;outline:none}
.text-input:focus{border-color:rgba(184,134,11,.6)}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:12px}
.stepper .ctr{display:flex;align-items:center;gap:14px}
.stepper button{width:30px;height:30px;border-radius:8px;background:rgba(184,134,11,.1);border:1px solid rgba(184,134,11,.25);cursor:pointer;color:var(--gold2);font-size:18px;font-weight:700;line-height:1}
.stepper .val{font-family:var(--fd);font-weight:700;font-size:18px;color:var(--gold2);min-width:26px;text-align:center}

/* ---------- menú ---------- */
#screen-menu{align-items:center;padding:calc(env(safe-area-inset-top) + 44px) 22px 28px}
.menu-top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;display:flex;gap:8px}
.logo{width:88px;height:88px;border-radius:18px;overflow:hidden;box-shadow:0 4px 28px rgba(184,134,11,.22),0 0 0 1px rgba(184,134,11,.25);background:rgba(184,134,11,.08);display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover}
.game-title{margin:16px 0 0;font-family:'Cinzel',serif;font-weight:700;font-size:30px;color:var(--cream);letter-spacing:9px}
.tagline{margin:4px 0 0;font-family:var(--fb);font-weight:500;font-size:12px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase}
.claim{margin:8px 0 0;font-size:12px;color:var(--dim);text-align:center}
.menu-list{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:22px}
.menu-btn{width:100%;padding:12px 14px;background:linear-gradient(135deg,rgba(26,22,24,.6),rgba(18,15,16,.35));border:1px solid rgba(184,134,11,.2);border-radius:13px;cursor:pointer;display:flex;align-items:center;gap:13px;text-align:left;transition:transform .1s}
.menu-btn:active{transform:scale(.985)}
.menu-btn .ic{width:42px;height:42px;border-radius:11px;background:rgba(184,134,11,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-btn .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.menu-btn .tx b{font-weight:600;font-size:15px;color:#fff}
.menu-btn .tx small{font-size:11.5px;color:var(--dim);line-height:1.35}
.menu-btn.hero{background:linear-gradient(135deg,rgba(184,134,11,.2),rgba(26,22,24,.6));border-color:rgba(184,134,11,.55);box-shadow:0 0 24px rgba(184,134,11,.12)}
.menu-btn.hero .ic{background:rgba(184,134,11,.2)}
.menu-btn.cont{border-color:rgba(107,191,122,.4);background:linear-gradient(135deg,rgba(40,85,55,.25),rgba(30,70,45,.1))}
.badge-live{font-size:9px;font-weight:800;letter-spacing:1px;color:#fff;background:#2EA043;padding:3px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.badge-live::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{50%{opacity:.25}}
.footer-v{margin-top:auto;padding-top:24px;font-family:var(--fb);font-size:11px;color:rgba(184,134,11,.3);letter-spacing:2px;text-transform:uppercase}

/* ---------- jugadores (marcador) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 8px;background:linear-gradient(135deg,rgba(184,134,11,.12),rgba(26,22,24,.4));border:1px solid rgba(184,134,11,.35);border-radius:12px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fd);font-weight:700;font-size:13px;color:#fff}
.pchip .nm{font-weight:600;font-size:13px;color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .x{width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,.08);cursor:pointer;color:var(--dim);font-size:13px;line-height:1}
.rchip{padding:7px 12px;border-radius:20px;border:1px dashed rgba(184,134,11,.35);background:none;color:rgba(212,168,58,.85);font-size:12px;font-weight:500;cursor:pointer}
.add-row{display:flex;gap:8px}
.add-row .btn{width:auto;padding:0 18px}

/* ---------- juramento / dedos ---------- */
#screen-oath{align-items:center;justify-content:center;padding:48px 32px;text-align:center;background:linear-gradient(180deg,#050505,var(--navy) 40%,var(--navy3))}
.oath-line{margin:4px 0;font-family:var(--fd);font-weight:700;font-size:30px;color:var(--gold);letter-spacing:5px;text-shadow:0 0 40px rgba(184,134,11,.2)}
#screen-finger{background:#050505}
#touchArea{position:absolute;inset:0}
.finger-title{position:relative;z-index:2;text-align:center;padding:calc(env(safe-area-inset-top) + 56px) 24px 0;pointer-events:none}
.finger-title h2{margin:0;font-family:var(--fd);font-size:19px;color:rgba(212,168,58,.85);letter-spacing:3px}
.finger-title p{margin:8px 0 0;font-size:12px;color:var(--faint)}
.finger-bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:2;display:flex;flex-direction:column;gap:8px;padding:0 28px}
@keyframes winnerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pick-result{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,5,.85);text-align:center}

/* ---------- marcador ---------- */
#scoreGrid{flex:1;overflow-y:auto;padding:16px 12px 8px}
.numpad{background:#070F1D;border-top:1px solid rgba(184,134,11,.15);padding:10px 12px calc(env(safe-area-inset-bottom) + 16px)}
.numpad .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nk{padding:13px 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:9px;cursor:pointer;font-weight:600;font-size:19px;color:rgba(255,255,255,.8)}
.nk:active{background:rgba(184,134,11,.2)}
.nk.neg{background:rgba(61,139,79,.14);border-color:rgba(61,139,79,.3);color:var(--green);font-size:16px;font-weight:700}
.nk.ok{background:linear-gradient(135deg,var(--gold),#9A7209);border:none;font-family:var(--fd);font-size:14px;letter-spacing:2px;color:#fff}
@keyframes blink{50%{opacity:0}}
.dropdown{position:absolute;top:42px;right:0;min-width:210px;background:linear-gradient(180deg,#17171A,var(--navy3));border:1px solid rgba(184,134,11,.25);border-radius:12px;padding:6px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.dropdown button{width:100%;padding:11px 12px;background:none;border:none;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;font-weight:500}
.dropdown button:hover{background:rgba(255,255,255,.05)}

/* ---------- ganador ---------- */
.confetti{position:absolute;top:-10px;border-radius:1px;animation:confettiFall linear forwards;opacity:.8}
@keyframes confettiFall{to{transform:translateY(900px) rotate(720deg);opacity:0}}

/* ---------- historial ---------- */
.tabs{display:flex;gap:6px;padding:0 16px;margin:12px 0}
.tabs button{flex:1;padding:9px 0;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:var(--dim)}
.tabs button.on{background:rgba(232,73,79,.12);border-color:rgba(232,73,79,.3);color:var(--blue)}
.match-card{padding:12px 14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:12px}
.tag{font-size:9px;font-weight:700;letter-spacing:.8px;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.tag.off{background:rgba(184,134,11,.15);color:var(--gold2)}
.tag.free{background:rgba(232,73,79,.12);color:var(--blue)}
.rank-table{border:1px solid rgba(232,73,79,.12);border-radius:12px;overflow:hidden}
.rank-row{display:grid;grid-template-columns:1fr 30px 30px 40px 44px 40px;align-items:center;padding:10px 10px;border-top:1px solid rgba(255,255,255,.04);font-size:12px}
.rank-row.head{border-top:none;background:rgba(232,73,79,.06);font-size:9px;font-weight:700;color:rgba(232,73,79,.7);text-transform:uppercase;letter-spacing:.4px}
.rank-row span{text-align:center}
.rank-row span:first-child{text-align:left;display:flex;align-items:center;gap:8px;overflow:hidden}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec{background:rgba(232,73,79,.04);border:1px solid rgba(232,73,79,.1);border-radius:11px;padding:12px;text-align:center}
.rec small{font-size:9px;color:rgba(232,73,79,.6);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.rec b{display:block;margin:5px 0 3px;font-family:var(--fd);font-size:24px;line-height:1}
.rec span{font-size:11px;color:var(--dim)}
.empty{padding:36px 20px;text-align:center;color:var(--faint);font-size:13px;line-height:1.6}

/* ---------- instrucciones ---------- */
.rules{padding:6px 16px 40px;display:flex;flex-direction:column;gap:10px}
.rule{background:rgba(184,134,11,.045);border:1px solid rgba(184,134,11,.13);border-radius:13px;padding:15px 16px}
.rule h3{margin:0 0 8px;font-family:var(--fd);font-size:13px;color:var(--cream);letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.rule h3 .n{width:22px;height:22px;border-radius:50%;background:rgba(184,134,11,.18);color:var(--gold2);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.rule p,.rule li{margin:0 0 7px;font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.8)}
.rule ul{margin:0;padding-left:18px}
.rule b{color:var(--cream);font-weight:600}
.rule .hl{color:var(--gold2);font-weight:600}
.rule .note{font-size:12px;color:rgba(232,73,79,.85);background:rgba(232,73,79,.06);border-radius:8px;padding:8px 10px;margin-top:6px}
.vtable{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:10px 12px;background:rgba(0,0,0,.18);border-radius:9px;font-size:13px}
.vtable span:nth-child(even){text-align:right;color:var(--cream);font-weight:600}
.sp-card{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.sp-card .mini{width:34px;height:46px;border-radius:5px;background:#F4EDE0;color:#1a1a1a;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ---------- ajustes / modales ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:22px}
.modal.active{display:flex}
.modal-box{width:100%;max-width:340px;background:linear-gradient(180deg,var(--navy3),var(--navy));border:1px solid rgba(184,134,11,.25);border-radius:18px;padding:24px 20px;text-align:center;max-height:90dvh;overflow-y:auto}
.modal-box h2{margin:0 0 8px;font-family:var(--fd);font-size:16px;color:var(--cream);letter-spacing:1px}
.modal-box .row{display:flex;gap:8px;margin-top:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);text-align:left}
.set-row:last-child{border-bottom:none}
.set-row b{font-size:13px;font-weight:600}
.set-row small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.switch{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);border:none;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--gold)}
.switch.on::after{left:23px}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);z-index:200;display:flex;flex-direction:column;gap:6px;width:min(400px,calc(100% - 24px));pointer-events:none}
.toast{background:rgba(14,12,13,.96);border:1px solid rgba(184,134,11,.35);border-radius:11px;padding:10px 14px;font-size:13px;color:var(--cream);box-shadow:0 6px 24px rgba(0,0,0,.5);animation:toastIn .25s ease-out}
.toast.bad{border-color:rgba(224,96,96,.5)}
.toast.good{border-color:rgba(107,191,122,.5)}
.toast.big{font-family:var(--fd);font-size:15px;text-align:center;letter-spacing:1px;border-color:var(--gold);background:rgba(40,30,5,.96)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}

/* ---------- online ---------- */
.profile-card{display:flex;align-items:center;gap:12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat3 div{text-align:center;padding:10px 4px;background:rgba(0,0,0,.18);border-radius:10px}
.stat3 b{display:block;font-family:var(--fd);font-size:20px;color:var(--gold2)}
.stat3 small{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.code-big{font-family:var(--fd);font-weight:900;font-size:44px;letter-spacing:10px;color:var(--gold2);text-align:center;margin:6px 0;text-shadow:0 0 30px rgba(184,134,11,.3)}
.code-input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:var(--fd);font-weight:700;font-size:20px}
.lobby-player{display:flex;align-items:center;gap:12px;padding:11px 12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:12px}
.lobby-player .nm{flex:1;font-weight:600;font-size:14px}
.lobby-slot{padding:11px 12px;border:1px dashed rgba(255,255,255,.1);border-radius:12px;color:var(--faint);font-size:12px;text-align:center}
.spinner{width:18px;height:18px;border:2px solid rgba(184,134,11,.25);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- mesa de juego ---------- */
#screen-game{background:radial-gradient(ellipse 90% 60% at 50% 46%,#3A0D12 0%,#1C0709 48%,#080506 100%);min-height:100dvh}
.g-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}
.g-top .rd{flex:1;text-align:center;font-family:var(--fd);font-size:13px;letter-spacing:2px;color:var(--cream)}
.g-top .rd small{display:block;font-family:var(--fb);font-size:10px;letter-spacing:.3px;color:var(--dim);margin-top:1px}
.opps{display:grid;gap:8px;padding:6px 10px}
.opps.n1{grid-template-columns:1fr}
.opps.n2{grid-template-columns:1fr 1fr}
.opps.n3,.opps.n4,.opps.n5{grid-template-columns:1fr 1fr 1fr}
.opp{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:7px 6px 8px;text-align:center;transition:border-color .2s,box-shadow .2s;min-width:0}
.opp.turn{border-color:var(--gold2);box-shadow:0 0 16px rgba(212,168,58,.35)}
.opp.gone{opacity:.35}
.opp .who{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.opp .who span{overflow:hidden;text-overflow:ellipsis}
.opp .pts{font-size:10px;color:var(--dim);margin-top:1px}
.opp .row{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;margin-top:6px}
.shield{font-size:9px;font-weight:800;color:#111;background:var(--gold2);border-radius:5px;padding:1px 4px;letter-spacing:.3px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 12px;min-height:180px}
.piles{display:flex;align-items:flex-end;justify-content:center;gap:22px}
.pile{display:flex;flex-direction:column;align-items:center;gap:5px}
.pile small{font-size:10px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
.drawn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .25s ease-out}
.drawn-wrap small{font-size:10px;color:var(--gold2);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.status{font-size:13px;color:var(--cream);text-align:center;min-height:18px;padding:0 10px;line-height:1.4}
.status b{color:var(--gold2)}
.timer{width:70%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .25s linear}
.timer.hot i{background:linear-gradient(90deg,#C84848,#E07070)}
.me-area{padding:8px 12px 4px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.25))}
.me-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);margin-bottom:6px;padding:0 4px}
.me-head b{color:var(--cream);font-size:12px}
.me-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.actions{padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.35);border-top:1px solid rgba(212,168,58,.15)}
.hint{font-size:12.5px;color:var(--cream);text-align:center;line-height:1.45}
.hint b{color:var(--gold2)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.btn-talmut{background:linear-gradient(135deg,#7A1F1F,#B83232);color:#fff;box-shadow:0 0 18px rgba(184,50,50,.35)}

/* cartas */
.pc{position:relative;width:62px;height:88px;border-radius:8px;flex-shrink:0;transition:transform .15s,box-shadow .2s;perspective:600px}
.pc.sm{width:30px;height:42px;border-radius:4px}
.pc.lg{width:74px;height:104px;border-radius:9px}
.pc .face,.pc .back{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s}
.pc .back{background:radial-gradient(circle at 50% 50%,rgba(200,32,42,.35),transparent 60%),repeating-linear-gradient(45deg,#141012 0 5px,#0B090A 5px 10px);border:2px solid #C9A04A;box-shadow:inset 0 0 0 2px #070707,inset 0 0 0 3px rgba(200,32,42,.55),0 3px 8px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.pc .back::after{content:'T';font-family:'Cinzel',serif;font-weight:900;color:rgba(212,168,58,.75);font-size:22px}
.pc.sm .back::after{font-size:12px}
.pc.sm .back{border-width:1px}
.pc .face{background:linear-gradient(160deg,#FBF6EC,#EDE3D0);border:1px solid #CDBF9F;box-shadow:0 3px 8px rgba(0,0,0,.45);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1B1B1B}
.pc.up .face{transform:rotateY(0)}
.pc.up .back{transform:rotateY(-180deg)}
.pc .face .r{font-weight:800;font-size:24px;line-height:1}
.pc .face .s{font-size:22px;line-height:1;margin-top:2px}
.pc.lg .face .r{font-size:28px}
.pc.sm .face .r{font-size:12px}
.pc.sm .face .s{font-size:11px;margin:0}
.pc .face .c{position:absolute;top:4px;left:5px;font-size:10px;font-weight:800;line-height:1}
.pc.sm .face .c{display:none}
.pc .face.red{color:#B82828}
.pc .face .jk{font-size:10px;font-weight:800;letter-spacing:1px}
.pc.sm .face .jk{font-size:6px;letter-spacing:0}
.pc.empty{border:1.5px dashed rgba(255,255,255,.12);background:rgba(255,255,255,.02)}
.pc.empty .back,.pc.empty .face{display:none}
.pc.click{cursor:pointer}
.pc.click .back{box-shadow:inset 0 0 0 2px #070707,0 0 0 2px rgba(212,168,58,.9),0 0 14px rgba(212,168,58,.55)}
.pc.click:active{transform:scale(.94)}
.pc.sel .back,.pc.sel .face{box-shadow:0 0 0 3px #6BBF7A,0 0 18px rgba(107,191,122,.6)}
.pc.flash{animation:flashRing 1.2s ease-out}
@keyframes flashRing{0%{transform:scale(1.12);filter:drop-shadow(0 0 10px #D4A83A)}100%{transform:scale(1)}}
.pc.gone-anim{animation:fadeOut .4s forwards}
.pile-empty{width:62px;height:88px;border-radius:8px;border:1.5px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--faint);text-align:center}
.overlay{position:absolute;inset:0;z-index:40;background:rgba(4,14,11,.97);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 26px) 16px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
.reveal-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);margin-bottom:7px}
.reveal-row.win{background:rgba(46,160,67,.13);border-color:rgba(107,191,122,.4)}
.reveal-row .nm{width:74px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reveal-row .cards{flex:1;display:flex;gap:3px;flex-wrap:wrap}
.reveal-row .sc{text-align:right;min-width:48px}
.reveal-row .sc b{display:block;font-family:var(--fd);font-size:16px}
.reveal-row .sc small{font-size:10px;color:var(--dim)}

/* responsive */
@media (min-width:600px) and (max-width:1099px) and (orientation:portrait){
  body{background:var(--navy2)}
  .screen{max-width:100%}
}
@media (min-width:1100px),(orientation:landscape) and (min-width:800px){
  body{background:#040C17;display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:24px 0}
  .screen{max-width:480px;border-radius:26px;overflow:hidden}
  .screen.active{min-height:min(calc(100dvh - 48px),920px);box-shadow:0 24px 80px rgba(0,0,0,.85),0 0 0 1px rgba(184,134,11,.12)}
  .topbar,.g-top,.finger-title{padding-top:28px}
  #screen-menu{padding-top:28px}
}
/* ---------- tipografía v2: gótica moderna para títulos, Sora para texto y números ---------- */
.topbar h1{font-weight:700;font-size:22px;letter-spacing:1.5px}
.btn{font-family:var(--fd)!important;font-weight:700;font-size:17px;letter-spacing:1.5px}
.btn-ghost,.btn-google{font-family:var(--fb)!important;font-size:13px;letter-spacing:0}
.menu-btn .tx b{font-family:var(--fd);font-size:20px;font-weight:600;letter-spacing:.6px}
.rule h3{font-size:17px;letter-spacing:.4px}
.modal-box h2{font-size:21px}
.section-label span{font-size:10px;letter-spacing:2.5px;font-weight:600}
.code-big,.code-input,.stepper .val,.rec b,.stat3 b,.reveal-row .sc b,#winnerScoreVal,.nk,.avatar{font-family:var(--fb)!important}
.code-big{font-weight:800;letter-spacing:8px}
.stat3 b,.rec b{font-weight:800}
.g-top .rd{font-size:16px;letter-spacing:1px}
/* ---------- ordenar cartas ---------- */
.order-bar{display:flex;flex-wrap:wrap;justify-content:center;margin-top:8px}
.order-btn{border:1px solid rgba(184,134,11,.35);background:rgba(184,134,11,.08);color:var(--gold2);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.order-btn.on{background:var(--gold2);color:#1a1205;border-color:var(--gold2)}
.me-row.ordering .pc{animation:wiggle .5s ease-in-out infinite alternate;cursor:pointer}
.me-row.ordering .pc:nth-child(2n){animation-delay:.25s}
.me-row .pc.osel{outline:3px solid var(--gold2);outline-offset:3px;transform:translateY(-8px)}
@keyframes wiggle{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.me-row .pc.osel{animation:none}
/* ---------- amigos / estadísticas ---------- */
.f-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(184,134,11,.12);border-radius:12px}
.f-row .nm{flex:1;min-width:0}
.f-row .nm b{display:block;font-weight:600;font-size:14px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-row .nm small{font-size:11px;color:var(--dim)}
.f-add{border:1px solid rgba(184,134,11,.4);background:none;color:var(--gold2);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.f-add.on{background:rgba(107,191,122,.12);border-color:rgba(107,191,122,.45);color:var(--green)}
.f-tag{font-size:10px;color:var(--blue);border:1px solid rgba(232,73,79,.35);border-radius:6px;padding:1px 5px;margin-left:6px;font-weight:600}
.me-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.me-stats div{text-align:center;background:rgba(0,0,0,.18);border-radius:10px;padding:10px 2px}
.me-stats b{display:block;font-family:var(--fb);font-weight:800;font-size:20px;color:var(--gold2)}
.me-stats small{font-size:10px;color:var(--dim)}
.lb-row{display:grid;grid-template-columns:22px 1fr 34px 34px 44px;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.lb-row.head{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(184,134,11,.2)}
.lb-row .pos{font-family:var(--fd);font-size:17px;color:var(--gold2);text-align:center}
.lb-row .who{display:flex;align-items:center;gap:8px;min-width:0}
.lb-row .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row span:not(.who):not(.pos){text-align:center;font-variant-numeric:tabular-nums}
.lb-row.me{background:rgba(184,134,11,.08);border-radius:8px}


/* tipografía v3: grotesca compacta estilo Coolvetica */
body{letter-spacing:-.1px}
.btn:not(.btn-ghost):not(.btn-google),.topbar h1{text-transform:none!important;letter-spacing:-.3px!important}
.btn:not(.btn-ghost):not(.btn-google){font-size:17px;font-weight:800}
.topbar h1{font-size:23px!important;font-weight:800!important}
.menu-btn .tx b{font-weight:800;font-size:18px;letter-spacing:-.4px}
.rule h3{font-weight:800;letter-spacing:-.3px}
.modal-box h2,.oath-line,.finger-title h2,#winnerName,.g-top .rd,.lb-row .pos{font-weight:800;letter-spacing:-.3px}
.g-top .rd{font-size:17px}
.section-label span{letter-spacing:1.5px}

/* ---------- estilo v3: negro, rojo y dorado ---------- */
body{background:#070708}
.screen{background:radial-gradient(ellipse 120% 50% at 50% 0%,rgba(200,32,42,.16),transparent 60%),linear-gradient(180deg,#0E0D0F 0%,#09090A 45%,#0C0809 100%)}
.topbar h1{color:#F3EBDD}
.divider{background:linear-gradient(90deg,transparent,rgba(200,32,42,.55),rgba(212,168,58,.45),rgba(200,32,42,.55),transparent)}
.menu-btn{background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid rgba(212,168,58,.18);border-radius:16px;backdrop-filter:blur(6px)}
.menu-btn .ic{background:linear-gradient(135deg,rgba(200,32,42,.22),rgba(212,168,58,.08));border:1px solid rgba(212,168,58,.18);border-radius:13px}
.menu-btn.hero{background:linear-gradient(135deg,rgba(200,32,42,.42),rgba(110,12,18,.35) 55%,rgba(212,168,58,.12));border-color:rgba(212,168,58,.6);box-shadow:0 6px 28px rgba(200,32,42,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.menu-btn.hero .ic{background:linear-gradient(135deg,#E8343E,#8E0F17);border-color:rgba(212,168,58,.55)}
.menu-btn.hero .ic svg *{stroke:#FFE7A8}
.logo{border-radius:22px;box-shadow:0 8px 34px rgba(200,32,42,.35),0 0 0 1px rgba(212,168,58,.45)}
.game-title{color:#F3EBDD;text-shadow:0 2px 24px rgba(200,32,42,.35)}
.tagline{color:var(--gold2)}
.btn{border-radius:14px}
.btn-gold{background:linear-gradient(180deg,#E3BC55,#B8860B 55%,#946B08);color:#140C02;box-shadow:0 6px 22px rgba(212,168,58,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-red,.btn-talmut{background:linear-gradient(180deg,#E8343E,#A3111B);color:#fff;box-shadow:0 6px 22px rgba(200,32,42,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:rgba(212,168,58,.22)}
.card-box,.rule,.match-card,.f-row,.lobby-player{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border-color:rgba(212,168,58,.14)}
.rule h3 .n{background:linear-gradient(135deg,#E8343E,#8E0F17);color:#FFE7A8}
.tabs button.on,.seg button.on{background:linear-gradient(180deg,rgba(200,32,42,.35),rgba(200,32,42,.18));border-color:rgba(232,52,62,.55);color:#FFE2E3;box-shadow:none}
.modal-box{background:linear-gradient(180deg,#151215,#0B0A0B);border-color:rgba(212,168,58,.3)}
.toast{background:rgba(14,12,13,.97);border-color:rgba(212,168,58,.4)}

/* ---------- intro estudio SM42 ---------- */
#intro{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse 70% 55% at 50% 48%,#1a1f27 0%,#0c0e12 60%,#060709 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity .55s ease}
#intro.out{opacity:0;pointer-events:none}
#intro .code{position:absolute;font:9px/1.5 ui-monospace,Menlo,monospace;color:#5d7392;white-space:pre;opacity:0;animation:codeIn 1.6s .5s ease forwards}
#intro .code.r{text-align:left}
@keyframes codeIn{to{opacity:.32}}
#intro .dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe2ff;box-shadow:0 0 6px #7fb2ff;opacity:0;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-8px)}}
#intro .stage{position:relative;text-align:center;animation:shake .35s 1.05s linear}
#intro .word{display:flex;justify-content:center;font-family:'Saira',var(--fb);font-style:italic;font-weight:900;font-size:min(27vw,150px);line-height:.9;letter-spacing:-.02em}
#intro .word span{display:inline-block;color:#f4f8ff;-webkit-text-stroke:2px #1d4f9c;paint-order:stroke fill;text-shadow:0 0 18px rgba(120,170,255,.55),0 0 42px rgba(60,120,255,.35),3px 4px 0 #0d2a5e;opacity:0;transform:scale(2.6) translateZ(0);filter:blur(10px);animation:slam .42s cubic-bezier(.2,1.3,.4,1) forwards}
#intro .word span:nth-child(1){animation-delay:.55s}#intro .word span:nth-child(2){animation-delay:.67s}#intro .word span:nth-child(3){animation-delay:.79s}#intro .word span:nth-child(4){animation-delay:.91s}
@keyframes slam{60%{opacity:1;filter:blur(0)}to{opacity:1;transform:scale(1);filter:blur(0)}}
#intro .word{position:relative}
#intro .word:after{content:'';position:absolute;inset:-10% -20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sweep .9s 1.35s ease-out forwards;mix-blend-mode:overlay;pointer-events:none}
@keyframes sweep{to{transform:translateX(120%)}}
#intro .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(140,185,255,.45),transparent 55%);opacity:0;animation:flash .7s 1.03s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#intro .sub{margin-top:min(4vw,22px);font-family:'Saira',var(--fb);font-weight:500;font-size:min(4.6vw,26px);letter-spacing:.42em;padding-left:.42em;color:#c9d0da;opacity:0;animation:subIn .9s 1.4s ease forwards}
@keyframes subIn{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-4px,3px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}100%{transform:translate(0)}}
#intro.wait *{animation-play-state:paused!important}
#intro .tapgo{display:none;position:absolute;bottom:calc(env(safe-area-inset-bottom) + 70px);left:0;right:0;text-align:center;font-family:'Saira',var(--fb);font-weight:500;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#d8b39f;animation:tapPulse 1.6s ease-in-out infinite!important;animation-play-state:running!important}
#intro.wait .tapgo{display:block}
@keyframes tapPulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

      <div class="ic" style="background:rgba(107,191,122,.12)"><svg width="18" height="20" viewBox="0 0 18 20"><polygon points="3,2 16,10 3,18" fill="#6BBF7A"/></svg></div>

      <div class="ic">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#D4A83A" stroke-width="1.8" stroke-linecap="round">

const RULES = {
es:`
<div class="rule"><h3><span class="n">★</span>El objetivo</h3>
<p>Terminar la partida con <b>los menos puntos posibles</b>. Cada jugador tiene cartas boca abajo que no puede mirar: tendrás que recordar las que has visto, adivinar las demás y elegir el momento exacto para cerrar la ronda.</p>
<p class="muted">2 a 6 jugadores · baraja francesa de 54 cartas (52 + 2 comodines) · 20–40 minutos.</p></div>

<div class="rule"><h3><span class="n">1</span>Valor de las cartas</h3>
<div class="vtable">
<span>As</span><span>1</span>
<span>2 a 10</span><span>su número</span>
<span>J</span><span>20</span>
<span>Q</span><span>30</span>
<span>K</span><span>40</span>
<span>Comodín</span><span>−1 si ganas la ronda · 50 si no</span>
</div></div>

<div class="rule"><h3><span class="n">2</span>Preparación</h3>
<p>Se baraja y se reparten <b>4 cartas boca abajo</b> a cada jugador, en fila. El resto forma el <b>mazo</b>, boca abajo.</p>
<p>A la de tres, todos miran a la vez <b>2 de sus 4 cartas</b> durante un par de segundos y las vuelven a dejar boca abajo. <span class="hl">Memorízalas:</span> después no podrás volver a mirarlas.</p>
<p>En la primera ronda se sortea quién empieza (la app tiene un sorteo con los dedos). En las siguientes empieza el ganador de la ronda anterior. Se juega en el sentido de las agujas del reloj.</p></div>

<div class="rule"><h3><span class="n">3</span>Tu turno</h3>
<p>Roba la carta de arriba del mazo y mírala sin enseñarla. Después elige:</p>
<ul>
<li><b>Quedártela:</b> cámbiala por una de tus cartas boca abajo. La carta que sacas va <b>boca arriba</b> al descarte.</li>
<li><b>Descartarla:</b> ponla boca arriba en el descarte. Si es un <b>10, J, Q o K</b>, usas su poder.</li>
</ul></div>

<div class="rule"><h3><span class="n">4</span>Cartas con poder</h3>
<p class="muted" style="margin-bottom:10px">Solo funcionan si las descartas nada más robarlas. Si te las quedas, solo cuentan como puntos. Usar el poder es opcional.</p>
<div class="sp-card"><div class="mini">10</div><p><b>Mira una de tus cartas.</b></p></div>
<div class="sp-card"><div class="mini">J</div><p><b>Mira una carta de un rival.</b></p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">Q</div><p><b>Intercambia a ciegas</b> dos cartas de jugadores distintos (una puede ser tuya). Nadie las mira.</p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">K</div><p><b>Mira una carta de un rival</b> y, si quieres, cámbiala por una tuya o pásasela a otro jugador a cambio de una de las suyas.</p></div></div>

<div class="rule"><h3><span class="n">5</span>Descarte cruzado</h3>
<p>Cada vez que una carta cae en el descarte, <b>cualquier jugador</b> que crea tener otra carta <b>del mismo valor</b> puede descartarla al instante, aunque no sea su turno. Así te quitas cartas de encima. Puedes soltar dos iguales a la vez.</p>
<p><span class="hl">La velocidad es ley:</span> si varios lo intentan, solo vale el más rápido.</p>
<p>Si te equivocas (la carta no coincide), la carta vuelve a su sitio y <b>robas una carta de penalización</b> boca abajo, sin mirarla.</p>
<p class="note">Online: tienes 3 segundos tras cada descarte para tocar tu carta.</p></div>

<div class="rule"><h3><span class="n">6</span>¡TALMUT!</h3>
<p>Cuando creas que tus cartas suman <b>5 puntos o menos</b>, canta <span class="hl">«¡TALMUT!»</span> al empezar tu turno (en lugar de robar) o justo después de descartar.</p>
<ul>
<li>Desde ese momento eres <b>intocable</b>: nadie puede mirar, cambiar ni mover tus cartas.</li>
<li>Cada uno de los demás juega <b>un último turno</b>. Después, todos dan la vuelta a sus cartas.</li>
<li>Si alguien se queda sin cartas por descartes cruzados, el TALMUT se canta solo.</li>
</ul>
<p><b>Cuidado:</b> si cantas TALMUT y sumas <b>más de 5</b>, te anotas la suma de los puntos de las cartas de todos los demás jugadores.</p></div>

<div class="rule"><h3><span class="n">7</span>Puntuación de la ronda</h3>
<ul>
<li>Quien tenga <b>menos puntos</b> gana la ronda y se anota <b>0</b>.</li>
<li>Los demás se anotan los puntos de sus cartas.</li>
<li>Si el ganador tiene un comodín, se anota <b>−1</b> por cada uno. Si no ganas, cada comodín vale <b>50</b>. (Para decidir quién gana, el comodín cuenta como −1.)</li>
<li>Si empata quien cantó TALMUT con otro jugador, gana el otro.</li>
</ul></div>

<div class="rule"><h3><span class="n">8</span>La partida</h3>
<p>La partida oficial dura <b>10 rondas</b>. Gana quien tenga <b>menos puntos acumulados</b>. Si hay empate, se juega una ronda de desempate.</p>
<p>¿Poco tiempo? Juega una <b>partida libre</b> con las rondas que queráis.</p></div>

<div class="rule"><h3><span class="n">9</span>Penalizaciones (con baraja real)</h3>
<p>Cualquier jugador puede señalar una infracción. Cada una cuesta <b>una carta de penalización</b> boca abajo:</p>
<ul><li>Mirar tus cartas sin una carta que lo permita.</li><li>Robar fuera de tu turno.</li><li>Hacer un descarte cruzado con una carta que no coincide.</li></ul>
<p class="note">Online, la app controla las reglas por ti: solo se castigan el descarte cruzado fallido y el TALMUT erróneo.</p></div>

<div class="rule"><h3><span class="n">✦</span>El ritual (opcional)</h3>
<p>La tradición dice que antes de cada partida oficial los jugadores juntan las manos en el centro y dicen a la vez el lema del juego: <span class="hl">«Hic ludus errorem punit»</span>, «este juego castiga el error». Puedes activar o desactivar esta pantalla en Ajustes.</p></div>

<div class="rule"><h3><span class="n">?</span>Consejos</h3>
<ul>
<li>Las cartas que te quedas del mazo ya las conoces: úsalas para cambiar las que no has visto.</li>
<li>Fíjate en lo que descartan los demás: te dice qué cartas tienen y cuáles no.</li>
<li>Canta TALMUT pronto si vas bien: cada turno extra da tiempo a los demás.</li>
</ul></div>`,
en:`
<div class="rule"><h3><span class="n">★</span>The goal</h3>
<p>Finish the game with <b>as few points as possible</b>. Every player has face-down cards they cannot look at: you must remember the ones you have seen, guess the rest and pick the perfect moment to end the round.</p>
<p class="muted">2 to 6 players · standard 54-card deck (52 + 2 jokers) · 20–40 minutes.</p></div>

<div class="rule"><h3><span class="n">1</span>Card values</h3>
<div class="vtable">
<span>Ace</span><span>1</span>
<span>2 to 10</span><span>face value</span>
<span>J</span><span>20</span>
<span>Q</span><span>30</span>
<span>K</span><span>40</span>
<span>Joker</span><span>−1 if you win the round · 50 if not</span>
</div></div>

<div class="rule"><h3><span class="n">2</span>Setup</h3>
<p>Shuffle and deal <b>4 cards face down</b> to each player, in a row. The rest form the face-down <b>deck</b>.</p>
<p>On three, everyone looks at <b>2 of their 4 cards</b> at the same time for a couple of seconds, then puts them back face down. <span class="hl">Memorise them:</span> you cannot look at them again.</p>
<p>In the first round, draw lots to see who starts (the app has a finger picker). After that, the winner of the previous round starts. Play goes clockwise.</p></div>

<div class="rule"><h3><span class="n">3</span>Your turn</h3>
<p>Draw the top card of the deck and look at it without showing it. Then choose:</p>
<ul>
<li><b>Keep it:</b> swap it for one of your face-down cards. The card you take out goes <b>face up</b> on the discard pile.</li>
<li><b>Discard it:</b> place it face up on the discard pile. If it is a <b>10, J, Q or K</b>, you use its power.</li>
</ul></div>

<div class="rule"><h3><span class="n">4</span>Power cards</h3>
<p class="muted" style="margin-bottom:10px">They only work if you discard them right after drawing them. If you keep them, they only count as points. Using the power is optional.</p>
<div class="sp-card"><div class="mini">10</div><p><b>Look at one of your cards.</b></p></div>
<div class="sp-card"><div class="mini">J</div><p><b>Look at an opponent’s card.</b></p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">Q</div><p><b>Blindly swap</b> two cards belonging to different players (one can be yours). Nobody looks at them.</p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">K</div><p><b>Look at an opponent’s card</b> and, if you want, swap it for one of yours or pass it to another player in exchange for one of theirs.</p></div></div>

<div class="rule"><h3><span class="n">5</span>Snap</h3>
<p>Every time a card lands on the discard pile, <b>any player</b> who thinks they have another card <b>of the same value</b> can discard it immediately, even if it is not their turn. That is how you get rid of cards. You can drop two matching cards at once.</p>
<p><span class="hl">Speed is law:</span> if several players try, only the fastest counts.</p>
<p>If you are wrong (the card does not match), it goes back to its place and you <b>draw a penalty card</b> face down, without looking.</p>
<p class="note">Online: you have 3 seconds after each discard to tap your card.</p></div>

<div class="rule"><h3><span class="n">6</span>TALMUT!</h3>
<p>When you think your cards add up to <b>5 points or less</b>, call <span class="hl">“TALMUT!”</span> at the start of your turn (instead of drawing) or right after discarding.</p>
<ul>
<li>From then on you are <b>untouchable</b>: nobody can look at, swap or move your cards.</li>
<li>Every other player gets <b>one last turn</b>. Then everyone reveals their cards.</li>
<li>If someone runs out of cards through snaps, TALMUT is called automatically.</li>
</ul>
<p><b>Careful:</b> if you call TALMUT and have <b>more than 5</b>, you score the sum of all the other players’ card points.</p></div>

<div class="rule"><h3><span class="n">7</span>Round scoring</h3>
<ul>
<li>The player with the <b>fewest points</b> wins the round and scores <b>0</b>.</li>
<li>Everyone else scores the points of their cards.</li>
<li>If the winner holds a joker, they score <b>−1</b> for each one. If you do not win, each joker is worth <b>50</b>. (To decide who wins, a joker counts as −1.)</li>
<li>If the TALMUT caller ties with another player, the other player wins.</li>
</ul></div>

<div class="rule"><h3><span class="n">8</span>The game</h3>
<p>An official game lasts <b>10 rounds</b>. The player with the <b>lowest total</b> wins. If there is a tie, play a tiebreak round.</p>
<p>Short on time? Play a <b>free game</b> with as many rounds as you like.</p></div>

<div class="rule"><h3><span class="n">9</span>Penalties (real deck)</h3>
<p>Any player can call out a mistake. Each one costs <b>one penalty card</b> face down:</p>
<ul><li>Looking at your cards without a card that allows it.</li><li>Drawing out of turn.</li><li>Snapping with a card that does not match.</li></ul>
<p class="note">Online, the app enforces the rules for you: only a missed snap and a wrong TALMUT are penalised.</p></div>

<div class="rule"><h3><span class="n">✦</span>The ritual (optional)</h3>
<p>Tradition says that before each official game the players stack their hands in the middle and say the motto together: <span class="hl">“Hic ludus errorem punit”</span>, “this game punishes mistakes”. You can turn this screen on or off in Settings.</p></div>

<div class="rule"><h3><span class="n">?</span>Tips</h3>
<ul>
<li>Cards you keep from the deck are known to you: use them to replace the ones you have not seen.</li>
<li>Watch what others discard: it tells you what they have and what they do not.</li>
<li>Call TALMUT early when you are doing well: every extra turn gives the others time.</li>
</ul></div>`
};

// =====================================================================

const LS={
  get(k,d){try{const v=localStorage.getItem('talmut.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('talmut.'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('talmut.'+k)}catch(e){}}
};
let LANG=LS.get('lang',(navigator.language||'es').toLowerCase().startsWith('es')?'es':'en');
function t(k,v){let s=(STR[LANG]&&STR[LANG][k])||STR.es[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const AV_COLORS=['#B8860B','#3B7DD8','#2EA043','#C0504D','#8E5BC8','#2AA5B5','#D2782A','#6A7A8C'];
function avColor(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function avatar(name,size){size=size||30;return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;background:${avColor(name)}">${esc(String(name).charAt(0).toUpperCase())}</div>`}
function toast(msg,kind,ms){if(kind==='bad'&&typeof play==='function')play('error');const w=document.getElementById('toasts');const d=document.createElement('div');d.className='toast'+(kind?' '+kind:'');d.innerHTML=msg;w.appendChild(d);while(w.children.length>3)w.firstChild.remove();setTimeout(()=>d.remove(),ms||2600)}
function buzz(ms){if(LS.get('vibrate',true)&&navigator.vibrate){try{navigator.vibrate(ms||60)}catch(e){}}}

function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.getAttribute('data-t'))});
  document.getElementById('nameInput').placeholder=t('setup.name');
  document.getElementById('rulesBody').innerHTML=RULES[LANG];
  document.getElementById('langEs').classList.toggle('on',LANG==='es');
  document.getElementById('langEn').classList.toggle('on',LANG==='en');
}
function setLang(l){LANG=l;LS.set('lang',l);applyI18n();refreshCurrent()}
function refreshCurrent(){
  const id=currentScreen();
  if(id==='screen-menu')refreshMenu();
  if(id==='screen-setup')renderSetup();
  if(id==='screen-score')renderScoreScreen();
  if(id==='screen-history')renderHistory();
  if(id==='screen-friends')renderFriends();
  if(id==='screen-online')renderOnlineHome();
  if(id==='screen-lobby')renderLobby();
  if(id==='screen-game')renderGame();
}

// ---------- navegación ----------
function currentScreen(){const a=document.querySelector('.screen.active');return a?a.id:null}
function showScreen(id){
  const prev=currentScreen();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(prev!==id)navStack.push(prev);
}
const navStack=[];
function goMenu(){navStack.length=0;showScreen('screen-menu');refreshMenu()}
function openModal(id){document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('active')}

// Botón atrás de Android / navegador
history.pushState({talmut:1},'');
window.addEventListener('popstate',function(){
  history.pushState({talmut:1},'');
  const open=document.querySelector('.modal.active');
  if(open){open.classList.remove('active');return}
  const id=currentScreen();
  if(id==='screen-menu')return;
  if(id==='screen-score'||id==='screen-oath'||id==='screen-finger'){confirmExit();return}
  if(id==='screen-game'){openModal('leaveModal');return}
  if(id==='screen-lobby'){leaveOnline();return}
  if(id==='screen-rules'){rulesBack();return}
  if(id==='screen-winner'){goMenu();return}
  goMenu();
});
function rulesBack(){const p=navStack.pop();if(p&&p!=='screen-rules'&&document.getElementById(p)){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');refreshCurrent()}else goMenu()}

// ---------- ajustes ----------
function openSettings(){
  document.getElementById('ritualSwitch').classList.toggle('on',LS.get('ritual',true));
  document.getElementById('soundSwitch').classList.toggle('on',LS.get('vibrate',true));
  document.getElementById('musicSwitch').classList.toggle('on',SND.musicOn);document.getElementById('sfxSwitch').classList.toggle('on',SND.sfxOn);

function toggleRitual(){const v=!LS.get('ritual',true);LS.set('ritual',v);document.getElementById('ritualSwitch').classList.toggle('on',v)}
function toggleSound(){const v=!LS.get('vibrate',true);LS.set('vibrate',v);document.getElementById('soundSwitch').classList.toggle('on',v)}

// ---------- menú ----------
function refreshMenu(){
  const m=LS.get('current',null);
  const btn=document.getElementById('continueBtn');
  if(m&&m.players&&m.players.length){
    btn.classList.remove('hidden');
    document.getElementById('continueDesc').textContent=(m.type==='official'?t('official'):t('free'))+' · '+t('score.round',{r:Math.min(m.round,m.totalRounds),t:m.totalRounds})+' · '+m.players.map(p=>p.name).join(', ');
  }else btn.classList.add('hidden');

// =====================================================================

// =====================================================================
let setup={mode:'official',rounds:5,players:[]};
let M=null; // partida actual
let numpadValue='',editMode=false,editRound=0,editPlayerIdx=0;

function openSetup(){
  setup={mode:setup.mode||'official',rounds:setup.rounds||5,players:setup.players&&setup.players.length?setup.players:[]};
  renderSetup();showScreen('screen-setup');
}
function setSetupMode(m){setup.mode=m;renderSetup()}
function changeRounds(d){setup.rounds=Math.max(1,Math.min(20,setup.rounds+d));renderSetup()}
function addSetupPlayer(nameArg){
  const inp=document.getElementById('nameInput');
  const name=String(nameArg!=null?nameArg:inp.value).trim().replace(/\s+/g,' ').slice(0,16);
  if(!name)return;
  if(setup.players.some(p=>p.toLowerCase()===name.toLowerCase())){toast(t('setup.dup'),'bad');return}
  if(setup.players.length>=8){toast(t('setup.max'),'bad');return}
  setup.players.push(name);
  if(nameArg==null)inp.value='';
  renderSetup();
  if(nameArg==null)inp.focus();
}
function removeSetupPlayer(i){setup.players.splice(i,1);renderSetup()}
function renderSetup(){
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===setup.mode));
  document.getElementById('modeDesc').textContent=t(setup.mode==='official'?'setup.official.d':'setup.free.d');
  document.getElementById('roundsStepper').classList.toggle('hidden',setup.mode==='official');
  document.getElementById('roundsValue').textContent=setup.rounds;
  document.getElementById('setupChips').innerHTML=setup.players.map((n,i)=>
    `<div class="pchip">${avatar(n,28)}<span class="nm">${esc(n)}</span><button class="x" onclick="removeSetupPlayer(${i})" aria-label="x">&times;</button></div>`).join('');
  const recent=LS.get('names',[]).filter(n=>!setup.players.some(p=>p.toLowerCase()===n.toLowerCase())).slice(0,10);
  document.getElementById('recentWrap').classList.toggle('hidden',recent.length===0);
  document.getElementById('recentChips').innerHTML=recent.map(n=>`<button class="rchip" data-n="${esc(n)}" onclick="addSetupPlayer(this.dataset.n)">+ ${esc(n)}</button>`).join('');
  document.getElementById('setupCount').textContent=t('setup.count',{n:setup.players.length});
  document.getElementById('setupStart').disabled=setup.players.length<2;
}
function rememberNames(names){
  const old=LS.get('names',[]);
  const merged=[...names,...old.filter(o=>!names.some(n=>n.toLowerCase()===o.toLowerCase()))].slice(0,20);
  LS.set('names',merged);
}
function startScorer(){
  if(setup.players.length<2)return;
  rememberNames(setup.players);
  M={id:Date.now(),type:setup.mode,totalRounds:setup.mode==='official'?10:setup.rounds,
     players:setup.players.map((n,i)=>({id:i,name:n})),scores:{},round:1,idx:0,created:new Date().toISOString(),tiebreak:false};
  saveM();
  if(M.type==='official'&&LS.get('ritual',true))showScreen('screen-oath');
  else{resetFinger();showScreen('screen-finger')}
}
function afterOath(){resetFinger();showScreen('screen-finger')}
function goScore(){numpadValue='';editMode=false;renderScoreScreen();showScreen('screen-score')}
function saveM(){if(M)LS.set('current',M)}
function continueScorer(){M=LS.get('current',null);if(!M)return;goScore()}
function confirmExit(){openModal('exitModal')}
function abandonScorer(){closeModal('abandonModal');LS.del('current');M=null;goMenu()}
function toggleScoreMenu(e){e.stopPropagation();document.getElementById('scoreDropdown').classList.toggle('hidden')}
function closeScoreMenu(){document.getElementById('scoreDropdown').classList.add('hidden')}
document.addEventListener('click',e=>{if(!e.target.closest('#scoreDropdown'))closeScoreMenu()});

function playerTotals(){
  const out={};M.players.forEach(p=>{let s=0;for(let r=1;r<=M.totalRounds;r++){if(M.scores[r]&&M.scores[r][p.id]!==undefined)s+=M.scores[r][p.id]}out[p.id]=s});return out;
}
function editCell(r,pi){editMode=true;editRound=r;editPlayerIdx=pi;numpadValue='';renderScoreScreen()}
function renderScoreScreen(){
  if(!M)return;
  document.getElementById('scoreTitle').textContent=M.type==='official'?'TALMUT':t('free').toUpperCase();
  document.getElementById('scoreSubtitle').textContent=(M.tiebreak&&M.round>10?t('g.tiebreak')+' · ':'')+t('score.round',{r:Math.min(M.round,M.totalRounds),t:M.totalRounds});
  const n=M.players.length;
  const cols=`28px repeat(${n},minmax(0,1fr))`;
  const totals=playerTotals();
  const minTotal=Math.min(...Object.values(totals));
  let h='<div style="border:1.5px solid rgba(184,134,11,.3);border-radius:12px;overflow:hidden;background:rgba(24,20,22,.8)">';
  h+=`<div style="display:grid;grid-template-columns:${cols};position:sticky;top:0;background:#08192F;z-index:3;border-bottom:1.5px solid rgba(184,134,11,.2)"><div style="padding:8px 2px;text-align:center;font-size:9px;color:rgba(184,134,11,.5)">#</div>`;
  M.players.forEach(p=>{h+=`<div style="padding:7px 2px;text-align:center;border-left:1px solid rgba(184,134,11,.1);overflow:hidden"><span style="font-family:var(--fd);font-weight:600;font-size:10px;color:rgba(212,168,58,.9);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span></div>`});
  h+='</div>';
  for(let r=1;r<=M.totalRounds;r++){
    const active=r===M.round, future=r>M.round;
    const vals=[];let complete=true;
    M.players.forEach(p=>{if(M.scores[r]&&M.scores[r][p.id]!==undefined)vals.push(M.scores[r][p.id]);else complete=false});
    const rMin=complete?Math.min(...vals):null,rMax=complete?Math.max(...vals):null;
    h+=`<div style="display:grid;grid-template-columns:${cols};${active?'background:rgba(184,134,11,.05);':''}border-bottom:1px solid rgba(184,134,11,.08)">`;
    h+=`<div style="display:flex;align-items:center;justify-content:center;height:36px;font-size:10px;font-weight:${active?700:600};color:${active?'#D4A83A':'rgba(184,134,11,'+(future?.25:.5)+')'}">${r>10?'★':r}</div>`;
    M.players.forEach((p,pi)=>{
      const has=M.scores[r]&&M.scores[r][p.id]!==undefined;
      const isAct=(!editMode&&active&&pi===M.idx&&!has)||(editMode&&r===editRound&&pi===editPlayerIdx);
      if(isAct){
        const neg=numpadValue&&parseInt(numpadValue)<0;
        h+=`<div style="display:flex;align-items:center;justify-content:center;height:36px;border-left:1px solid rgba(184,134,11,.08);box-shadow:inset 0 0 0 1.5px rgba(212,168,58,.6);background:rgba(184,134,11,.14)"><span style="font-weight:700;font-size:14px;color:${neg?'#6BBF7A':'#D4A83A'}${numpadValue?'':';animation:blink 1s infinite'}">${numpadValue||'_'}</span></div>`;
      }else if(has){
        const s=M.scores[r][p.id];let bg='',col='rgba(255,255,255,.82)',fw=500;
        if(complete){if(s===rMin){bg='background:rgba(46,160,67,.25);';col='#7EE29A';fw=700}else if(s===rMax&&rMax!==rMin){bg='background:rgba(200,50,50,.2);';col='#F08A8A';fw=700}}
        h+=`<div onclick="editCell(${r},${pi})" style="display:flex;align-items:center;justify-content:center;height:36px;border-left:1px solid rgba(184,134,11,.08);cursor:pointer;${bg}"><span style="font-weight:${fw};font-size:14px;color:${col}">${s}</span></div>`;
      }else h+=`<div style="display:flex;align-items:center;justify-content:center;height:36px;border-left:1px solid rgba(184,134,11,.08);color:rgba(255,255,255,.1)">—</div>`;
    });
    h+='</div>';
  }
  h+=`<div style="display:grid;grid-template-columns:${cols};border-top:1.5px solid rgba(184,134,11,.3);background:rgba(184,134,11,.07)"><div style="display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:8px;color:rgba(184,134,11,.7)">${t('tot')}</div>`;
  M.players.forEach(p=>{const v=totals[p.id];h+=`<div style="padding:7px 2px;text-align:center;border-left:1px solid rgba(184,134,11,.08)"><span style="font-family:var(--fd);font-weight:700;font-size:15px;color:${v===minTotal?'#7EE29A':'#E8DCC8'}">${v}</span></div>`});
  h+='</div></div>';
  // clasificación
  const st=M.players.map(p=>({name:p.name,total:totals[p.id]})).sort((a,b)=>a.total-b.total);
  h+=`<div class="section-label"><span>${t('score.class')}</span></div><div style="border:1.5px solid rgba(184,134,11,.25);border-radius:12px;overflow:hidden;background:rgba(24,20,22,.8)">`;
  st.forEach((s,i)=>{
    const diff=s.total-st[0].total;
    const medal=i===0?'#D4A83A':i===1?'#B4BEC8':i===2?'#C08050':'rgba(255,255,255,.3)';
    h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;${i<st.length-1?'border-bottom:1px solid rgba(255,255,255,.04)':''}"><span style="width:20px;text-align:center;font-family:var(--fd);font-weight:700;color:${medal}">${i+1}</span>${avatar(s.name,24)}<span style="flex:1;font-weight:600;font-size:13px">${esc(s.name)}</span><b style="font-size:14px;color:var(--cream)">${s.total}</b><span style="min-width:40px;text-align:right;font-size:11px;color:var(--faint)">${i===0?'—':'+'+diff}</span></div>`;
  });
  h+=`</div><div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:12px 0 6px;font-size:11px;color:var(--faint)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(46,160,67,.35);vertical-align:-1px"></i> ${t('score.win')}</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(200,50,50,.3);vertical-align:-1px"></i> ${t('score.lose')}</span><span>✎ ${t('score.tap')}</span></div>`;
  document.getElementById('scoreGrid').innerHTML=h;
  const ctx=document.getElementById('numpadContext');

(function(){

  off.forEach(g=>g.players.forEach(p=>{

  h+=`</div><p class="muted" style="text-align:center;font-size:10px;margin:8px 0 0">${t('hist.legend')}</p>`;
  const best=rows.reduce((a,s)=>s.best<a.v?{v:s.best,n:s.name}:a,{v:Infinity,n:'-'});
  const worst=rows.reduce((a,s)=>s.worst>a.v?{v:s.worst,n:s.name}:a,{v:-Infinity,n:'-'});
  const mw=rows.reduce((a,s)=>s.w>a.v?{v:s.w,n:s.name}:a,{v:0,n:'-'});
  const ba=rows.reduce((a,s)=>s.pt/s.pj<a.v?{v:s.pt/s.pj,n:s.name}:a,{v:Infinity,n:'-'});

  h+=`<div class="section-label"><span>${t('hist.records')}</span></div><div class="rec-grid">${rec(t('hist.bestGame'),best.v,'var(--green)',best.n)}${rec(t('hist.worstGame'),worst.v,'var(--red)',worst.n)}${rec(t('hist.mostWins'),mw.v,'var(--blue)',mw.n)}${rec(t('hist.bestAvg'),Math.round(ba.v),'var(--gold2)',ba.n)}</div>`;
  body.innerHTML=h;
}

const SND={ctx:null,master:null,rev:null,noiseBuf:null,music:null,musicOn:LS.get('music',true),sfxOn:LS.get('sfx',true),unlocked:false};
function sndInit(){
  if(SND.ctx)return SND.ctx;

  const c=new AC();SND.ctx=c;

  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  SND.master.connect(comp);comp.connect(c.destination);

  const len=c.sampleRate*1.6,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}

}

function _env(g,t,a,peak,d,end){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(end||0.0001,t+a+d)}

  _env(g,t,o.a||.005,o.v||.2,o.d||.1);
  let node=g;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;g.connect(f);node=f}
  osc.connect(g);node.connect(SND.master);if(o.rev)node.connect(SND.rev);
  osc.start(t);osc.stop(t+(o.a||.005)+(o.d||.1)+.05);
}
function noise(o){ // {t,a,d,v,type,f,f2,q,rev}
  const c=SND.ctx,t=c.currentTime+(o.t||0),src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();

  _env(g,t,o.a||.003,o.v||.2,o.d||.08);
  src.connect(f);f.connect(g);g.connect(SND.master);if(o.rev)g.connect(SND.rev);
  src.start(t,Math.random()*.5);src.stop(t+(o.a||.003)+(o.d||.08)+.05);
}

function applyState(id,code,state,version){
  if(G&&G.id===id&&version<=G.version)return;
  const prevStatus=G&&G.id===id?G.pub.status:null;
  const prevTurn=G&&G.id===id?G.pub.turn:null,prevPhase=G&&G.id===id?G.pub.phase:null;
  if(!G||G.id!==id){lastEventId=0;UI.flash={};UI.hl={}}
  if(G&&G.pub.phase==='special_k2'&&state.phase!=='special_k2'){const lim=Date.now()+4000;for(const k in UI.flash)if(UI.flash[k].until>lim)delete UI.flash[k]}
  G={id,code:code||(G&&G.code),pub:state,version};
  LS.set('onlineGame',{id,code:G.code});
  const me=myIdx();
  // limpiar selección local cuando cambia la fase
  if(state.phase!=='decide'||state.turn!==me)UI.pending=null;
  if(state.status!=='peek')UI.peekSel=[];
  if(state.phase!=='special')UI.qFirst=null;
  processEvents(state);
  if(state.status==='play'&&state.turn===me&&state.phase==='draw'&&(prevTurn!==me||prevPhase!=='draw')){buzz(80);play('turn')}
  if(prevStatus&&prevStatus!==state.status){
    if(state.status==='peek')play('deal');
    else if(state.status==='round_end')play('roundEnd');
    else if(state.status==='finished'){const w=state.standings&&state.standings[0];play(w&&w.i===me?'win':'roundEnd')}
  }
  const scr=currentScreen();
  if(state.status==='lobby'){if(scr!=='screen-lobby')showScreen('screen-lobby');renderLobby()}
  else if(['peek','play','round_end','finished'].includes(state.status)){if(scr!=='screen-game')showScreen('screen-game');renderGame()}
  if(state.status==='finished'&&prevStatus&&prevStatus!=='finished'){LS.del('onlineGame');loadProfile()}
}
function myIdx(){if(!G||!session)return -1;return G.pub.players.findIndex(p=>p.uid===session.user.id)}
function pname(i){if(!G||!G.pub.players[i])return '?';return i===myIdx()?t('g.you'):esc(G.pub.players[i].name)}

function enterGame(){
  if(!G)return;
  subscribe();
  if(G.pub.status==='lobby'){showScreen('screen-lobby');renderLobby()}else{showScreen('screen-game');renderGame()}
}
function subscribe(){
  unsubscribe();
  const id=G.id;
  channel=sb.channel('game:'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+id},p=>{if(G&&G.id===id)applyState(id,p.new.code,p.new.state,p.new.version)}).subscribe();
  pollTimer=setInterval(async()=>{if(!G)return;const{data}=await sb.from('games').select('code,state,version').eq('id',G.id).maybeSingle();if(data&&G)applyState(G.id,data.code,data.state,data.version)},5000);
  tickTimer=setInterval(tick,250);
}
function unsubscribe(){if(channel){sb.removeChannel(channel);channel=null}clearInterval(pollTimer);clearInterval(tickTimer)}
async function leaveOnline(confirmed){
  if(G&&G.pub.status!=='finished'){
    if(G.pub.status!=='lobby'&&!confirmed){openModal('leaveModal');return}
    await api('leave');
  }
  unsubscribe();G=null;LS.del('onlineGame');
  openOnline();
}

// Reloj: barra de tiempo y aviso al servidor cuando vence un plazo
function tick(){
  if(!G)return;
  const p=G.pub;
  const bar=document.getElementById('gTimer');
  if(p.deadline&&bar){
    const total=p.status==='peek'?12000:p.phase==='snap'?3000:p.status==='round_end'?15000:p.phase==='draw'?25000:20000;
    const left=Math.max(0,p.deadline-serverNow());
    const pct=Math.max(0,Math.min(100,left/total*100));
    bar.firstChild.style.width=pct+'%';
    bar.classList.toggle('hot',left<4000&&p.phase!=='snap');
    // tic-tac en los últimos segundos de tu turno
    const me=myIdx(),mine=p.status==='play'&&p.turn===me&&p.phase!=='snap';
    if(mine&&left>0&&left<5000){const sec=Math.ceil(left/1000);if(UI.lastTick!==sec+'|'+p.deadline){UI.lastTick=sec+'|'+p.deadline;play('tick')}}
    bar.style.visibility='visible';
  }else if(bar)bar.style.visibility='hidden';
  if(p.status==='lobby'&&p.isPublic&&currentScreen()==='screen-lobby'){const el=document.getElementById('lobbyCountdown');if(el&&p.deadline)el.textContent=t('lob.auto',{s:Math.max(0,Math.ceil((p.deadline-serverNow())/1000))})}
  if(p.status==='round_end'){const el=document.getElementById('nextIn');if(el)el.textContent=t('g.nextIn',{s:Math.max(0,Math.ceil((p.deadline-serverNow())/1000))})}
  // limpiar flashes caducados
  let changed=false;const now=Date.now();
  for(const k in UI.flash)if(UI.flash[k].until<now){delete UI.flash[k];changed=true}
  for(const k in UI.hl)if(UI.hl[k]<now){delete UI.hl[k];changed=true}
  if(changed&&currentScreen()==='screen-game')renderGame();
  // vencimiento de plazo
  if(p.deadline&&serverNow()>p.deadline+350&&!inFlight){
    const key=G.version+':'+p.deadline;
    if(advanceKey!==key){advanceKey=key;inFlight=true;api('advance').finally(()=>{inFlight=false})}
  }
}

// ---------- eventos → avisos ----------
function cardName(c){if(!c)return '';if(c[0]==='X')return 'JOKER';const r=c.slice(0,-1),s=c.slice(-1);return r+({S:'♠',H:'♥',D:'♦',C:'♣'}[s])}
function processEvents(st){
  const evs=st.events||[];
  if(lastEventId===0||evs.length&&evs[0].id>lastEventId+12){lastEventId=evs.length?evs[evs.length-1].id:0;return}
  const me=myIdx();
  evs.filter(e=>e.id>lastEventId).forEach(e=>{
    const n=pname(e.p),until=Date.now()+1800;
    switch(e.type){
      case 'keep': if(e.p!==me)toast(t('ev.keep',{n,c:cardName(e.card)}));UI.hl[e.p+'-'+e.s]=until;play('place');break;
      case 'discard': if(e.p!==me)toast(t('ev.discard',{n,c:cardName(e.card)}));play('discard');break;
      case 'snap': toast(t('ev.snap',{n,c:cardName(e.card)}),'good');play('snapOk');break;
      case 'snap_fail': toast(t('ev.snapFail',{n,c:cardName(e.card)}),'bad');UI.flash[e.p+'-'+e.s]={card:e.card,until:Date.now()+2200};if(e.p===me)buzz(200);play('snapFail');break;
      case 'talmut': toast(t(e.auto?'ev.talmutAuto':'ev.talmut',{n}),'big',3200);buzz(150);play('talmut');break;
      case 'look_own': if(e.p!==me){toast(t('ev.lookOwn',{n}));UI.hl[e.p+'-'+e.s]=until;play('flip')}break;
      case 'look_other': if(e.p!==me){toast(t('ev.lookOther',{n,t:pname(e.t)}));UI.hl[e.t+'-'+e.s]=until;play('flip')}break;
      case 'swap_blind': play('slide');if(e.p!==me)toast(t('ev.swap',{n}));UI.hl[e.a.p+'-'+e.a.s]=until;UI.hl[e.b.p+'-'+e.b.s]=until;break;
      case 'k_swap': play('slide');if(e.p!==me)toast(t('ev.kswap',{n}));UI.hl[e.a.p+'-'+e.a.s]=until;UI.hl[e.b.p+'-'+e.b.s]=until;break;
      case 'auto': toast(t('ev.auto',{n}));break;
      case 'left': toast(t('ev.left',{n}),'bad');play('error');break;
      case 'join': if(e.p!==me){toast(t('ev.join',{n}));play('notify')}break;
      case 'reshuffle': toast(t('ev.reshuffle'));play('shuffle');break;
      case 'reorder': if(e.p!==me){moveKnown(e.p,e.order);toast(t('ev.reorder',{n}));play('slide')}break;
    }
  });
  if(evs.length)lastEventId=evs[evs.length-1].id;
}
