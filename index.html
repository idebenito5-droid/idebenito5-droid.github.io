const RULES = {
es:`
<div class="rule"><h3><span class="n">★</span>El objetivo</h3>
<p>Terminar la partida con <b>los menos puntos posibles</b>. Cada jugador tiene cartas boca abajo que no puede mirar: tendrás que recordar las que has visto, adivinar las demás y elegir el momento exacto para cerrar la ronda.</p>
<p class="muted">2 a 6 jugadores · baraja francesa de 54 cartas (52 + 2 comodines) · 20–40 minutos.</p></div>

<div class="rule"><h3><span class="n">1</span>Valor de las cartas</h3>
<div class="vtable">
<span>As</span><span>1</span>
<span>2 a 10</span><span>su número</span>
<span>J</span><span>20</span>
<span>Q</span><span>30</span>
<span>K</span><span>40</span>
<span>Comodín</span><span>−1 si ganas con él solo · 0 si ganas con más cartas · 50 si no ganas</span>
</div></div>

<div class="rule"><h3><span class="n">2</span>Preparación</h3>
<p>Se baraja y se reparten <b>4 cartas boca abajo</b> a cada jugador, en fila. El resto forma el <b>mazo</b>, boca abajo.</p>
<p>A la de tres, todos miran a la vez <b>2 de sus 4 cartas</b> durante un par de segundos y las vuelven a dejar boca abajo. <span class="hl">Memorízalas:</span> después no podrás volver a mirarlas.</p>
<p>En la primera ronda se sortea quién empieza (la app tiene un sorteo con los dedos). En las siguientes empieza el ganador de la ronda anterior. Se juega en el sentido de las agujas del reloj.</p></div>

<div class="rule"><h3><span class="n">3</span>Tu turno</h3>
<p>Roba la carta de arriba del mazo y mírala sin enseñarla. Después elige:</p>
<ul>
<li><b>Quedártela:</b> cámbiala por una de tus cartas boca abajo. La carta que sacas va <b>boca arriba</b> al descarte.</li>
<li><b>Descartarla:</b> ponla boca arriba en el descarte. Si es un <b>10, J, Q o K</b>, usas su poder.</li>
</ul></div>

<div class="rule"><h3><span class="n">4</span>Cartas con poder</h3>
<p class="muted" style="margin-bottom:10px">Solo funcionan si las descartas nada más robarlas. Si te las quedas, solo cuentan como puntos. Usar el poder es opcional.</p>
<div class="sp-card"><div class="mini">10</div><p><b>Mira una de tus cartas.</b></p></div>
<div class="sp-card"><div class="mini">J</div><p><b>Mira una carta de un rival.</b></p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">Q</div><p><b>Intercambia a ciegas</b> dos cartas de jugadores distintos (una puede ser tuya). Nadie las mira.</p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">K</div><p><b>Mira una carta de un rival</b> y, si quieres, cámbiala por una tuya o pásasela a otro jugador a cambio de una de las suyas.</p></div></div>

<div class="rule"><h3><span class="n">5</span>Descarte cruzado</h3>
<p>Cada vez que una carta cae en el descarte, <b>cualquier jugador</b> que crea tener otra carta <b>del mismo valor</b> puede descartarla al instante, aunque no sea su turno. Así te quitas cartas de encima. Puedes soltar dos iguales a la vez.</p>
<p><span class="hl">La velocidad es ley:</span> si varios lo intentan, solo vale el más rápido.</p>
<p>Si te equivocas (la carta no coincide), la carta vuelve a su sitio y <b>robas una carta de penalización</b> boca abajo, sin mirarla.</p>
<p class="note">Online: tienes 3 segundos tras cada descarte para tocar tu carta.</p></div>

<div class="rule"><h3><span class="n">6</span>¡TALMUT!</h3>
<p>Cuando creas que tus cartas suman <b>5 puntos o menos</b>, canta <span class="hl">«¡TALMUT!»</span> al empezar tu turno (en lugar de robar) o justo después de descartar.</p>
<ul>
<li>Desde ese momento eres <b>intocable</b>: nadie puede mirar, cambiar ni mover tus cartas.</li>
<li>Cada uno de los demás juega <b>un último turno</b>. Después, todos dan la vuelta a sus cartas.</li>
<li>Si alguien se queda sin cartas por descartes cruzados, el TALMUT se canta solo.</li>
</ul>
<p><b>Cuidado:</b> si cantas TALMUT y sumas <b>más de 5</b>, te anotas la suma de los puntos de las cartas de todos los demás jugadores.</p></div>

<div class="rule"><h3><span class="n">7</span>Puntuación de la ronda</h3>
<ul>
<li>Quien tenga <b>menos puntos</b> gana la ronda y se anota <b>0</b>.</li>
<li>Los demás se anotan los puntos de sus cartas.</li>
<li>Si el ganador se queda <b>solo con el comodín</b>, se anota <b>−1</b>. Si gana con el comodín y alguna carta más, se anota <b>0</b>. Si no ganas, cada comodín vale <b>50</b>. (Para decidir quién gana, el comodín cuenta como −1.)</li>
<li>Si empata quien cantó TALMUT con otro jugador, gana el otro.</li>
</ul></div>

<div class="rule"><h3><span class="n">8</span>La partida</h3>
<p>La partida oficial dura <b>10 rondas</b>. Gana quien tenga <b>menos puntos acumulados</b>. Si hay empate, se juega una ronda de desempate.</p>
<p>¿Poco tiempo? Juega una <b>partida libre</b> con las rondas que queráis.</p></div>

<div class="rule"><h3><span class="n">9</span>Penalizaciones (con baraja real)</h3>
<p>Cualquier jugador puede señalar una infracción. Cada una cuesta <b>una carta de penalización</b> boca abajo:</p>
<ul><li>Mirar tus cartas sin una carta que lo permita.</li><li>Robar fuera de tu turno.</li><li>Hacer un descarte cruzado con una carta que no coincide.</li></ul>
<p class="note">Online, la app controla las reglas por ti: solo se castigan el descarte cruzado fallido y el TALMUT erróneo.</p></div>

<div class="rule"><h3><span class="n">✦</span>El ritual (opcional)</h3>
<p>La tradición dice que antes de cada partida oficial los jugadores juntan las manos en el centro y dicen a la vez el lema del juego: <span class="hl">«Hic ludus errorem punit»</span>, «este juego castiga el error». Puedes activar o desactivar esta pantalla en Ajustes.</p></div>

<div class="rule"><h3><span class="n">?</span>Consejos</h3>
<ul>
<li>Las cartas que te quedas del mazo ya las conoces: úsalas para cambiar las que no has visto.</li>
<li>Fíjate en lo que descartan los demás: te dice qué cartas tienen y cuáles no.</li>
<li>Canta TALMUT pronto si vas bien: cada turno extra da tiempo a los demás.</li>
</ul></div>`,
en:`
<div class="rule"><h3><span class="n">★</span>The goal</h3>
<p>Finish the game with <b>as few points as possible</b>. Every player has face-down cards they cannot look at: you must remember the ones you have seen, guess the rest and pick the perfect moment to end the round.</p>
<p class="muted">2 to 6 players · standard 54-card deck (52 + 2 jokers) · 20–40 minutes.</p></div>

<div class="rule"><h3><span class="n">1</span>Card values</h3>
<div class="vtable">
<span>Ace</span><span>1</span>
<span>2 to 10</span><span>face value</span>
<span>J</span><span>20</span>
<span>Q</span><span>30</span>
<span>K</span><span>40</span>
<span>Joker</span><span>−1 if you win with only the joker · 0 if you win with more cards · 50 if you don't win</span>
</div></div>

<div class="rule"><h3><span class="n">2</span>Setup</h3>
<p>Shuffle and deal <b>4 cards face down</b> to each player, in a row. The rest form the face-down <b>deck</b>.</p>
<p>On three, everyone looks at <b>2 of their 4 cards</b> at the same time for a couple of seconds, then puts them back face down. <span class="hl">Memorise them:</span> you cannot look at them again.</p>
<p>In the first round, draw lots to see who starts (the app has a finger picker). After that, the winner of the previous round starts. Play goes clockwise.</p></div>

<div class="rule"><h3><span class="n">3</span>Your turn</h3>
<p>Draw the top card of the deck and look at it without showing it. Then choose:</p>
<ul>
<li><b>Keep it:</b> swap it for one of your face-down cards. The card you take out goes <b>face up</b> on the discard pile.</li>
<li><b>Discard it:</b> place it face up on the discard pile. If it is a <b>10, J, Q or K</b>, you use its power.</li>
</ul></div>

<div class="rule"><h3><span class="n">4</span>Power cards</h3>
<p class="muted" style="margin-bottom:10px">They only work if you discard them right after drawing them. If you keep them, they only count as points. Using the power is optional.</p>
<div class="sp-card"><div class="mini">10</div><p><b>Look at one of your cards.</b></p></div>
<div class="sp-card"><div class="mini">J</div><p><b>Look at an opponent’s card.</b></p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">Q</div><p><b>Blindly swap</b> two cards belonging to different players (one can be yours). Nobody looks at them.</p></div>
<div class="sp-card"><div class="mini" style="color:#B82828">K</div><p><b>Look at an opponent’s card</b> and, if you want, swap it for one of yours or pass it to another player in exchange for one of theirs.</p></div></div>

<div class="rule"><h3><span class="n">5</span>Snap</h3>
<p>Every time a card lands on the discard pile, <b>any player</b> who thinks they have another card <b>of the same value</b> can discard it immediately, even if it is not their turn. That is how you get rid of cards. You can drop two matching cards at once.</p>
<p><span class="hl">Speed is law:</span> if several players try, only the fastest counts.</p>
<p>If you are wrong (the card does not match), it goes back to its place and you <b>draw a penalty card</b> face down, without looking.</p>
<p class="note">Online: you have 3 seconds after each discard to tap your card.</p></div>

<div class="rule"><h3><span class="n">6</span>TALMUT!</h3>
<p>When you think your cards add up to <b>5 points or less</b>, call <span class="hl">“TALMUT!”</span> at the start of your turn (instead of drawing) or right after discarding.</p>
<ul>
<li>From then on you are <b>untouchable</b>: nobody can look at, swap or move your cards.</li>
<li>Every other player gets <b>one last turn</b>. Then everyone reveals their cards.</li>
<li>If someone runs out of cards through snaps, TALMUT is called automatically.</li>
</ul>
<p><b>Careful:</b> if you call TALMUT and have <b>more than 5</b>, you score the sum of all the other players’ card points.</p></div>

<div class="rule"><h3><span class="n">7</span>Round scoring</h3>
<ul>
<li>The player with the <b>fewest points</b> wins the round and scores <b>0</b>.</li>
<li>Everyone else scores the points of their cards.</li>
<li>If the winner is left with <b>only the joker</b>, they score <b>−1</b>. If they win with the joker plus other cards, they score <b>0</b>. If you do not win, each joker is worth <b>50</b>. (To decide who wins, a joker counts as −1.)</li>
<li>If the TALMUT caller ties with another player, the other player wins.</li>
</ul></div>

<div class="rule"><h3><span class="n">8</span>The game</h3>
<p>An official game lasts <b>10 rounds</b>. The player with the <b>lowest total</b> wins. If there is a tie, play a tiebreak round.</p>
<p>Short on time? Play a <b>free game</b> with as many rounds as you like.</p></div>

<div class="rule"><h3><span class="n">9</span>Penalties (real deck)</h3>
<p>Any player can call out a mistake. Each one costs <b>one penalty card</b> face down:</p>
<ul><li>Looking at your cards without a card that allows it.</li><li>Drawing out of turn.</li><li>Snapping with a card that does not match.</li></ul>
<p class="note">Online, the app enforces the rules for you: only a missed snap and a wrong TALMUT are penalised.</p></div>

<div class="rule"><h3><span class="n">✦</span>The ritual (optional)</h3>
<p>Tradition says that before each official game the players stack their hands in the middle and say the motto together: <span class="hl">“Hic ludus errorem punit”</span>, “this game punishes mistakes”. You can turn this screen on or off in Settings.</p></div>

<div class="rule"><h3><span class="n">?</span>Tips</h3>
<ul>
<li>Cards you keep from the deck are known to you: use them to replace the ones you have not seen.</li>
<li>Watch what others discard: it tells you what they have and what they do not.</li>
<li>Call TALMUT early when you are doing well: every extra turn gives the others time.</li>
</ul></div>`
};

const LS={
  get(k,d){try{const v=localStorage.getItem('talmut.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('talmut.'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('talmut.'+k)}catch(e){}}
};
let LANG=LS.get('lang',(navigator.language||'es').toLowerCase().startsWith('es')?'es':'en');
function t(k,v){let s=(STR[LANG]&&STR[LANG][k])||STR.es[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const AV_COLORS=['#B8860B','#3B7DD8','#2EA043','#C0504D','#8E5BC8','#2AA5B5','#D2782A','#6A7A8C'];
function avColor(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function avatar(name,size){size=size||30;return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;background:${avColor(name)}">${esc(String(name).charAt(0).toUpperCase())}</div>`}
function toast(msg,kind,ms){if(kind==='bad'&&typeof play==='function')play('error');const w=document.getElementById('toasts');const d=document.createElement('div');d.className='toast'+(kind?' '+kind:'');d.innerHTML=msg;w.appendChild(d);while(w.children.length>3)w.firstChild.remove();setTimeout(()=>d.remove(),ms||2600)}
function buzz(ms){if(LS.get('vibrate',true)&&navigator.vibrate){try{navigator.vibrate(ms||60)}catch(e){}}}

function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.getAttribute('data-t'))});
  document.getElementById('nameInput').placeholder=t('setup.name');
  document.getElementById('rulesBody').innerHTML=RULES[LANG];
  document.getElementById('langEs').classList.toggle('on',LANG==='es');
  document.getElementById('langEn').classList.toggle('on',LANG==='en');
}
function setLang(l){LANG=l;LS.set('lang',l);applyI18n();refreshCurrent()}
function refreshCurrent(){
  const id=currentScreen();
  if(id==='screen-menu')refreshMenu();
  if(id==='screen-setup')renderSetup();
  if(id==='screen-score')renderScoreScreen();
  if(id==='screen-history')renderHistory();
  if(id==='screen-friends')renderFriends();
  if(id==='screen-online')renderOnlineHome();
  if(id==='screen-lobby')renderLobby();
  if(id==='screen-game')renderGame();
}

// ---------- navegación ----------
function currentScreen(){const a=document.querySelector('.screen.active');return a?a.id:null}
function showScreen(id){
  const prev=currentScreen();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(prev!==id)navStack.push(prev);
}
const navStack=[];
function goMenu(){navStack.length=0;showScreen('screen-menu');refreshMenu()}
function openModal(id){document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('active')}

// Botón atrás de Android / navegador
history.pushState({talmut:1},'');
window.addEventListener('popstate',function(){
  history.pushState({talmut:1},'');
  const open=document.querySelector('.modal.active');
  if(open){open.classList.remove('active');return}
  const id=currentScreen();
  if(id==='screen-menu')return;
  if(id==='screen-score'||id==='screen-oath'||id==='screen-finger'){confirmExit();return}
  if(id==='screen-game'){openModal('leaveModal');return}
  if(id==='screen-lobby'){leaveOnline();return}
  if(id==='screen-rules'){rulesBack();return}
  if(id==='screen-winner'){goMenu();return}
  goMenu();
});
function rulesBack(){const p=navStack.pop();if(p&&p!=='screen-rules'&&document.getElementById(p)){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');refreshCurrent()}else goMenu()}

// ---------- ajustes ----------
function openSettings(){
  document.getElementById('ritualSwitch').classList.toggle('on',LS.get('ritual',true));
  document.getElementById('soundSwitch').classList.toggle('on',LS.get('vibrate',true));
  document.getElementById('musicSwitch').classList.toggle('on',SND.musicOn);document.getElementById('sfxSwitch').classList.toggle('on',SND.sfxOn);

function toggleRitual(){const v=!LS.get('ritual',true);LS.set('ritual',v);document.getElementById('ritualSwitch').classList.toggle('on',v)}
function toggleSound(){const v=!LS.get('vibrate',true);LS.set('vibrate',v);document.getElementById('soundSwitch').classList.toggle('on',v)}

// ---------- menú ----------
function refreshMenu(){
  refreshMenuV5();menuCaw();
  setTimeout(()=>{const ml=document.getElementById('menuLevel');if(ml)ml.textContent=`${levelOf(achCount())[1]} · ${achCount()} ${L('hitos','milestones')} · ${L('color y estilo','colour & style')}`},0);

  }else btn.classList.add('hidden');
}

let setup={mode:'official',rounds:5,players:[]};
let M=null; // partida actual
let numpadValue='',editMode=false,editRound=0,editPlayerIdx=0;

function openSetup(){
  setup={mode:setup.mode||'official',rounds:setup.rounds||5,players:setup.players&&setup.players.length?setup.players:[]};
  renderSetup();showScreen('screen-setup');
}
function setSetupMode(m){setup.mode=m;renderSetup()}
function changeRounds(d){setup.rounds=Math.max(1,Math.min(20,setup.rounds+d));renderSetup()}
function addSetupPlayer(nameArg){
  const inp=document.getElementById('nameInput');
  const name=String(nameArg!=null?nameArg:inp.value).trim().replace(/\s+/g,' ').slice(0,16);
  if(!name)return;
  if(setup.players.some(p=>p.toLowerCase()===name.toLowerCase())){toast(t('setup.dup'),'bad');return}
  if(setup.players.length>=8){toast(t('setup.max'),'bad');return}
  setup.players.push(name);
  if(nameArg==null)inp.value='';
  renderSetup();
  if(nameArg==null)inp.focus();
}
function removeSetupPlayer(i){setup.players.splice(i,1);renderSetup()}
function renderSetup(){
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===setup.mode));
  document.getElementById('modeDesc').textContent=t(setup.mode==='official'?'setup.official.d':'setup.free.d');
  document.getElementById('roundsStepper').classList.toggle('hidden',setup.mode==='official');
  document.getElementById('roundsValue').textContent=setup.rounds;
  document.getElementById('setupChips').innerHTML=setup.players.map((n,i)=>
    `<div class="pchip">${avatar(n,28)}<span class="nm">${esc(n)}</span><button class="x" onclick="removeSetupPlayer(${i})" aria-label="x">&times;</button></div>`).join('');
  const recent=LS.get('names',[]).filter(n=>!setup.players.some(p=>p.toLowerCase()===n.toLowerCase())).slice(0,10);
  document.getElementById('recentWrap').classList.toggle('hidden',recent.length===0);
  document.getElementById('recentChips').innerHTML=recent.map(n=>`<button class="rchip" data-n="${esc(n)}" onclick="addSetupPlayer(this.dataset.n)">+ ${esc(n)}</button>`).join('');
  document.getElementById('setupCount').textContent=t('setup.count',{n:setup.players.length});
  document.getElementById('setupStart').disabled=setup.players.length<2;
}
function rememberNames(names){
  const old=LS.get('names',[]);
  const merged=[...names,...old.filter(o=>!names.some(n=>n.toLowerCase()===o.toLowerCase()))].slice(0,20);
  LS.set('names',merged);
}
function startScorer(){
  if(setup.players.length<2)return;
  rememberNames(setup.players);
  M={id:Date.now(),type:setup.mode,totalRounds:setup.mode==='official'?10:setup.rounds,
     players:setup.players.map((n,i)=>({id:i,name:n})),scores:{},round:1,idx:0,created:new Date().toISOString(),tiebreak:false};
  saveM();
  if(M.type==='official'&&LS.get('ritual',true))showScreen('screen-oath');
  else{resetFinger();showScreen('screen-finger')}
}
function afterOath(){resetFinger();showScreen('screen-finger')}
function goScore(){numpadValue='';editMode=false;renderScoreScreen();showScreen('screen-score')}
function saveM(){if(M)LS.set('current',M)}
function continueScorer(){M=LS.get('current',null);if(!M)return;goScore()}
function confirmExit(){openModal('exitModal')}
function abandonScorer(){closeModal('abandonModal');LS.del('current');M=null;goMenu()}
function toggleScoreMenu(e){e.stopPropagation();document.getElementById('scoreDropdown').classList.toggle('hidden')}
function closeScoreMenu(){document.getElementById('scoreDropdown').classList.add('hidden')}
document.addEventListener('click',e=>{if(!e.target.closest('#scoreDropdown'))closeScoreMenu()});

function playerTotals(){
  const out={};M.players.forEach(p=>{let s=0;for(let r=1;r<=M.totalRounds;r++){if(M.scores[r]&&M.scores[r][p.id]!==undefined)s+=M.scores[r][p.id]}out[p.id]=s});return out;
}
function editCell(r,pi){editMode=true;editRound=r;editPlayerIdx=pi;numpadValue='';renderScoreScreen()}
function renderScoreScreen(){
  if(!M)return;
  document.getElementById('scoreTitle').textContent=M.type==='official'?'TALMUT':t('free').toUpperCase();
  document.getElementById('scoreSubtitle').textContent=(M.tiebreak&&M.round>10?t('g.tiebreak')+' · ':'')+t('score.round',{r:Math.min(M.round,M.totalRounds),t:M.totalRounds});
  const n=M.players.length;
  const cols=`28px repeat(${n},minmax(0,1fr))`;
  const totals=playerTotals();
  const minTotal=Math.min(...Object.values(totals));
  let h='<div style="border:1.5px solid rgba(184,134,11,.3);border-radius:12px;overflow:hidden;background:rgba(24,20,22,.8)">';
  h+=`<div style="display:grid;grid-template-columns:${cols};position:sticky;top:0;background:#08192F;z-index:3;border-bottom:1.5px solid rgba(184,134,11,.2)"><div style="padding:8px 2px;text-align:center;font-size:9px;color:rgba(184,134,11,.5)">#</div>`;
  M.players.forEach(p=>{h+=`<div style="padding:7px 2px;text-align:center;border-left:1px solid rgba(184,134,11,.1);overflow:hidden"><span style="font-family:var(--fd);font-weight:600;font-size:10px;color:rgba(212,168,58,.9);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span></div>`});
  h+='</div>';
  for(let r=1;r<=M.totalRounds;r++){
    const active=r===M.round, future=r>M.round;
    const vals=[];let complete=true;
    M.players.forEach(p=>{if(M.scores[r]&&M.scores[r][p.id]!==undefined)vals.push(M.scores[r][p.id]);else complete=false});
    const rMin=complete?Math.min(...vals):null,rMax=complete?Math.max(...vals):null;
    h+=`<div style="display:grid;grid-template-columns:${cols};${active?'background:rgba(184,134,11,.05);':''}border-bottom:1px solid rgba(184,134,11,.08)">`;
    h+=`<div style="display:flex;align-items:center;justify-content:center;height:36px;font-size:10px;font-weight:${active?700:600};color:${active?'#D4A83A':'rgba(184,134,11,'+(future?.25:.5)+')'}">${r>10?'★':r}</div>`;
    M.players.forEach((p,pi)=>{
      const has=M.scores[r]&&M.scores[r][p.id]!==undefined;
      const isAct=(!editMode&&active&&pi===M.idx&&!has)||(editMode&&r===editRound&&pi===editPlayerIdx);
      if(isAct){
        const neg=numpadValue&&parseInt(numpadValue)<0;
        h+=`<div style="display:flex;align-items:center;justify-content:center;height:36px;border-left:1px solid rgba(184,134,11,.08);box-shadow:inset 0 0 0 1.5px rgba(212,168,58,.6);background:rgba(184,134,11,.14)"><span style="font-weight:700;font-size:14px;color:${neg?'#6BBF7A':'#D4A83A'}${numpadValue?'':';animation:blink 1s infinite'}">${numpadValue||'_'}</span></div>`;
      }else if(has){
        const s=M.scores[r][p.id];let bg='',col='rgba(255,255,255,.82)',fw=500;
        if(complete){if(s===rMin){bg='background:rgba(46,160,67,.25);';col='#7EE29A';fw=700}else if(s===rMax&&rMax!==rMin){bg='background:rgba(200,50,50,.2);';col='#F08A8A';fw=700}}
        h+=`<div onclick="editCell(${r},${pi})" style="display:flex;align-items:center;justify-content:center;height:36px;border-left:1px solid rgba(184,134,11,.08);cursor:pointer;${bg}"><span style="font-weight:${fw};font-size:14px;color:${col}">${s}</span></div>`;
      }else h+=`<div style="display:flex;align-items:center;justify-content:center;height:36px;border-left:1px solid rgba(184,134,11,.08);color:rgba(255,255,255,.1)">—</div>`;
    });
    h+='</div>';
  }
  h+=`<div style="display:grid;grid-template-columns:${cols};border-top:1.5px solid rgba(184,134,11,.3);background:rgba(184,134,11,.07)"><div style="display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:8px;color:rgba(184,134,11,.7)">${t('tot')}</div>`;
  M.players.forEach(p=>{const v=totals[p.id];h+=`<div style="padding:7px 2px;text-align:center;border-left:1px solid rgba(184,134,11,.08)"><span style="font-family:var(--fd);font-weight:700;font-size:15px;color:${v===minTotal?'#7EE29A':'#E8DCC8'}">${v}</span></div>`});
  h+='</div></div>';
  // clasificación
  const st=M.players.map(p=>({name:p.name,total:totals[p.id]})).sort((a,b)=>a.total-b.total);
  h+=`<div class="section-label"><span>${t('score.class')}</span></div><div style="border:1.5px solid rgba(184,134,11,.25);border-radius:12px;overflow:hidden;background:rgba(24,20,22,.8)">`;
  st.forEach((s,i)=>{
    const diff=s.total-st[0].total;
    const medal=i===0?'#D4A83A':i===1?'#B4BEC8':i===2?'#C08050':'rgba(255,255,255,.3)';
    h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;${i<st.length-1?'border-bottom:1px solid rgba(255,255,255,.04)':''}"><span style="width:20px;text-align:center;font-family:var(--fd);font-weight:700;color:${medal}">${i+1}</span>${avatar(s.name,24)}<span style="flex:1;font-weight:600;font-size:13px">${esc(s.name)}</span><b style="font-size:14px;color:var(--cream)">${s.total}</b><span style="min-width:40px;text-align:right;font-size:11px;color:var(--faint)">${i===0?'—':'+'+diff}</span></div>`;
  });
  h+=`</div><div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:12px 0 6px;font-size:11px;color:var(--faint)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(46,160,67,.35);vertical-align:-1px"></i> ${t('score.win')}</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(200,50,50,.3);vertical-align:-1px"></i> ${t('score.lose')}</span><span>✎ ${t('score.tap')}</span></div>`;
  document.getElementById('scoreGrid').innerHTML=h;
  const ctx=document.getElementById('numpadContext');
  if(editMode){const p=M.players[editPlayerIdx];ctx.innerHTML=`<span style="color:#F08A8A">✎ ${t('score.editing')} </span><b style="color:#D4A83A">${esc(p.name)}</b><span style="color:var(--dim)"> · R${editRound}</span> <button onclick="editMode=false;numpadValue='';renderScoreScreen()" style="margin-left:6px;background:none;border:1px solid rgba(240,138,138,.4);border-radius:5px;color:#F08A8A;font-size:10px;padding:2px 8px;cursor:pointer">${t('cancel')}</button>`}
  else if(M.idx<M.players.length){const p=M.players[M.idx];ctx.innerHTML=`<span style="color:var(--dim)">${t('score.of')} </span><b style="color:#D4A83A">${esc(p.name)}</b><span style="color:var(--dim)"> · R${M.round}</span>`}
}
function numpadInput(k){
  if(k==='back')numpadValue=numpadValue.slice(0,-1);
  else if(k==='-1')numpadValue='-1';

  h+=`</div><p class="muted" style="text-align:center;font-size:10px;margin:8px 0 0">${t('hist.legend')}</p>`;
  const best=rows.reduce((a,s)=>s.best<a.v?{v:s.best,n:s.name}:a,{v:Infinity,n:'-'});
  const worst=rows.reduce((a,s)=>s.worst>a.v?{v:s.worst,n:s.name}:a,{v:-Infinity,n:'-'});
  const mw=rows.reduce((a,s)=>s.w>a.v?{v:s.w,n:s.name}:a,{v:0,n:'-'});
  const ba=rows.reduce((a,s)=>s.pt/s.pj<a.v?{v:s.pt/s.pj,n:s.name}:a,{v:Infinity,n:'-'});

  h+=`<div class="section-label"><span>${t('hist.records')}</span></div><div class="rec-grid">${rec(t('hist.bestGame'),best.v,'var(--green)',best.n)}${rec(t('hist.worstGame'),worst.v,'var(--red)',worst.n)}${rec(t('hist.mostWins'),mw.v,'var(--blue)',mw.n)}${rec(t('hist.bestAvg'),Math.round(ba.v),'var(--gold2)',ba.n)}</div>`;
  body.innerHTML=h;
}

const SND={ctx:null,master:null,rev:null,noiseBuf:null,music:null,musicOn:LS.get('music',true),sfxOn:LS.get('sfx',true),unlocked:false};
function sndInit(){
  if(SND.ctx)return SND.ctx;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  const c=new AC();SND.ctx=c;
  SND.master=c.createGain();SND.master.gain.value=.75;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  SND.master.connect(comp);comp.connect(c.destination);
  // reverb sintética
  const len=c.sampleRate*1.6,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}

  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;SND.noiseBuf=nb;
  return c;
}

// --- bloques básicos ---
function _env(g,t,a,peak,d,end){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(end||0.0001,t+a+d)}
function tone(o){ // {f,f2,type,t,a,d,v,rev,dest}
  const c=SND.ctx,t=c.currentTime+(o.t||0),osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t);if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.a||.005)+(o.d||.1));
  if(o.det)osc.detune.value=o.det;
  _env(g,t,o.a||.005,o.v||.2,o.d||.1);
  let node=g;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;g.connect(f);node=f}
  osc.connect(g);node.connect(SND.master);if(o.rev)node.connect(SND.rev);
  osc.start(t);osc.stop(t+(o.a||.005)+(o.d||.1)+.05);
}
function noise(o){ // {t,a,d,v,type,f,f2,q,rev}
  const c=SND.ctx,t=c.currentTime+(o.t||0),src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=SND.noiseBuf;src.loop=true;f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||2000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+(o.a||.003)+(o.d||.08));f.Q.value=o.q||1;
  _env(g,t,o.a||.003,o.v||.2,o.d||.08);
  src.connect(f);f.connect(g);g.connect(SND.master);if(o.rev)g.connect(SND.rev);
  src.start(t,Math.random()*.5);src.stop(t+(o.a||.003)+(o.d||.08)+.05);
}

let _lastPlay={};
function play(n){

function startMusic(){

function applyState(id,code,state,version){
  if(G&&G.id===id&&version<=G.version)return;
  const prevStatus=G&&G.id===id?G.pub.status:null;
  const prevTurn=G&&G.id===id?G.pub.turn:null,prevPhase=G&&G.id===id?G.pub.phase:null;
  if(!G||G.id!==id){lastEventId=0;UI.flash={};UI.hl={}}
  if(G&&G.pub.phase==='special_k2'&&state.phase!=='special_k2'){const lim=Date.now()+4000;for(const k in UI.flash)if(UI.flash[k].until>lim)delete UI.flash[k]}
  const newGame=!G||G.id!==id;
  G={id,code:code||(G&&G.code),pub:state,version,local:id==='local'};
  if(!G.local)LS.set('onlineGame',{id,code:G.code});
  if(newGame&&!G.local)fetchColors(state.players.map(p=>p.uid));
  const me=myIdx();
  // limpiar selección local cuando cambia la fase
  if(state.phase!=='decide'||state.turn!==me)UI.pending=null;
  if(state.status!=='peek')UI.peekSel=[];
  if(state.phase!=='special')UI.qFirst=null;
  processEvents(state);
  if(state.status==='peek'&&prevStatus!=='peek'&&me>=0&&!state.peekDone[me]&&UI.readyKey!==id+':'+state.round){UI.readyKey=id+':'+state.round;setTimeout(()=>{if(G&&G.pub.status==='peek')showReady(G.pub)},prevStatus?350:50)}
  if(state.status==='round_end')trackRoundEnd(state);

}

function processEvents(st){
  const evs=st.events||[];

  const me=myIdx();

      case 'talmut': talmutMoment(n,e.auto,e.p===me);break;
      case 'k_swap_mark':break;
      case 'look_own': if(e.p!==me){UI.hl[e.p+'-'+e.s]=until;play('flip')}break;
      case 'look_other': if(e.p!==me){UI.hl[e.t+'-'+e.s]=until;play('flip')}break;
      case 'swap_blind': play('slide');UI.hl[e.a.p+'-'+e.a.s]=until;UI.hl[e.b.p+'-'+e.b.s]=until;break;
      case 'k_swap': play('slide');UI.hl[e.a.p+'-'+e.a.s]=until;UI.hl[e.b.p+'-'+e.b.s]=until;break;
      case 'auto': toast(t('ev.auto',{n}));break;
      case 'left': toast(t('ev.left',{n}),'bad');play('error');break;
      case 'join': if(e.p!==me){toast(t('ev.join',{n}));play('notify')}break;

      case 'reorder': if(e.p!==me){moveKnown(e.p,e.order);toast(t('ev.reorder',{n}));play('slide')}break;
    }
  });

// Qué cartas se pueden tocar ahora mismo
function canTap(pi,s){
  const p=G.pub,me=myIdx();
  if(Date.now()<(UI.readyUntil||0))return false;
  if(TUT&&!tutAllowTap(pi,s))return false;
  const has=p.players[pi]&&p.players[pi].slots[s];
  if(!has||me<0||p.players[me].left)return false;
  const immune=p.talmut&&p.talmut.by===pi;
  const oppOk=pi!==me&&!p.players[pi].left&&!immune;
  if(p.status==='peek')return pi===me&&!p.peekDone[me];
  if(p.status!=='play')return false;
  if(p.phase==='decide'&&p.turn===me)return pi===me;
  if(p.phase==='snap')return pi===me&&(p.snap.owner===null||p.snap.owner===me);
  if(p.phase==='draw'&&p.lastSnap&&pi===me&&(p.lastSnap.owner===null||p.lastSnap.owner===me))return true;
  if(p.special&&p.special.by===me){
    if(p.phase==='special'){
      const ty=p.special.type;
      if(ty==='10')return pi===me;
      if(ty==='J'||ty==='K')return oppOk;
      if(ty==='Q'){if(!(pi===me||oppOk))return false;if(UI.qFirst&&UI.qFirst.p===pi)return UI.qFirst.s===s;return true}
    }
    if(p.phase==='special_k2'){const k=p.special.k;return pi!==k.p&&(pi===me||oppOk)}
  }
  return false;
}
async function tapCard(pi,s){
  if(Date.now()<UI.noClickUntil)return;
  if(UI.ordering){return orderTap(pi,s)}
  if(!G||!canTap(pi,s)||inFlightAction)return;
  const p=G.pub,me=myIdx();
  if(p.status==='peek'){
    const i=UI.peekSel.indexOf(s);if(i>=0)UI.peekSel.splice(i,1);else UI.peekSel.push(s);
    play('tap');renderGame();
    if(UI.peekSel.length===2){const sel=UI.peekSel.slice();const r=await act('peek',{slots:sel});if(r&&r.priv&&r.priv.cards)r.priv.cards.forEach(c=>{UI.flash[me+'-'+c.s]={card:c.card,until:Date.now()+3500}});play('flip');SFX_later('flip',.12);UI.peekSel=[];renderGame()}
    return;
  }
  if(p.phase==='decide'){const from=rectOf(document.getElementById('gDrawnCard')),to=rectOf(cardEl(me,s));const r=await act('keep',{slot:s});if(r&&!r.error){flyCard(from,to,null,{ms:420,sound:'place'});document.getElementById('gMe').classList.remove('pick')}return}
  if(p.phase==='snap'||(p.phase==='draw'&&p.lastSnap)){const r=await act('snap',{slot:s});if(r&&r.priv&&r.priv.ok===false)buzz(200);return}
  if(p.phase==='special'){
    const ty=p.special.type;
    if(ty==='10'){const r=await act('special',{slot:s});if(r&&!r.error)trackSpecial(ty);handlePriv(r&&r.priv);return}
    if(ty==='J'||ty==='K'){const r=await act('special',{p:pi,s});if(r&&!r.error)trackSpecial(ty);handlePriv(r&&r.priv);return}
    if(ty==='Q'){
      if(!UI.qFirst){UI.qFirst={p:pi,s};play('tap');renderGame();return}
      if(UI.qFirst.p===pi&&UI.qFirst.s===s){UI.qFirst=null;renderGame();return}
      if(UI.qFirst.p===pi){UI.qFirst={p:pi,s};renderGame();return}
      const a=UI.qFirst;UI.qFirst=null;const r=await act('special',{a,b:{p:pi,s}});if(r&&!r.error)trackSpecial('Q');return;
    }
  }
  if(p.phase==='special_k2'){await act('special',{with:{p:pi,s}});return}
}
let inFlightAction=false;
async function act(action,payload){inFlightAction=true;try{return await api(action,payload)}finally{inFlightAction=false}}
function handlePriv(pv){

function renderActions(){
  const p=G.pub,me=myIdx(),el=document.getElementById('gActions'),st=document.getElementById('gStatus');
  let hint='',btns='',status='';
  const turnName=pname(p.turn);
  if(p.status==='peek'){
    hint=p.peekDone[me]?t('g.peekWait'):t('g.peek');
  }else if(p.status==='play'){
    const myTurn=p.turn===me;
    if(p.phase==='draw'){
      if(myTurn){hint=t('g.tapDeck')}
      else status=t('g.waitTurn',{n:turnName});
    }else if(p.phase==='decide'){
      if(myTurn){
        hint=t('g.decide');
        if(UI.pending){const r=rankOfC(UI.pending);if(['10','J','Q','K'].includes(r))hint+='<br><span style="color:var(--gold2)">'+t('g.decideSp',{p:POWER_TXT[LANG][r]})+'</span>'}
      }else status=t('g.waitDecide',{n:turnName});
    }else if(p.phase==='special'||p.phase==='special_k2'){
      const sp=p.special;
      if(sp.by===me){
        if(p.phase==='special_k2'){hint=t('g.spK2');btns=`<button class="btn btn-ghost" onclick="doSkip()">${t('g.noSwap')}</button>`}
        else{hint=sp.type==='Q'?(UI.qFirst?t('g.spQ2'):t('g.spQ1')):t('g.sp'+sp.type);btns=`<button class="btn btn-ghost" onclick="doSkip()">${t('g.noUse')}</button>`}
      }else status=t('g.waitSpecial',{n:pname(sp.by),c:sp.type});
    }else if(p.phase==='snap'){
      const r=p.discardTop?(p.discardTop[0]==='X'?'JOKER':p.discardTop.slice(0,-1)):'';
      hint=t('g.snap',{r});
      status=t('g.snapOwn',{r});
    }
  }
  if(TUT)btns='';
  st.innerHTML=status;
  setHtml(el,(hint?`<div class="hint">${hint}</div>`:'')+(btns?`<div class="btn-row">${btns}</div>`:''));
  setHtml(document.getElementById('gTalmut'),TUT&&!tutAllow('talmut')?'':talmutZoneHtml());
  el.style.display=(hint||btns)?'flex':'none';
}

const TRK={spGame:new Set(),gameKey:null,roundKey:null,snapR:0};
function trackEvents(st,evs){
  const me=myIdx();if(me<0)return;
  const gk=G.id+':'+(st.seq?0:0)+':'+st.totalRounds;
  if(TRK.gameKey!==G.id){TRK.gameKey=G.id;TRK.spGame=new Set()}
  evs.forEach(e=>{
    if(e.type==='round'){TRK.snapR=0}
    if(e.p!==me)return;
    switch(e.type){
      case 'talmut':bump('tal');if(e.auto)bump('talauto');break;
      case 'snap':bump('snap');TRK.snapR++;setMax('snapR',TRK.snapR);break;
      case 'snap_fail':bump('snapf');break;
    }
  });
}
function trackSpecial(type){
  const k={'10':'sp10',J:'spJ',Q:'spQ',K:'spK'}[type];if(!k)return;bump(k);
  TRK.spGame.add(type);if(TRK.spGame.size>=4)bump('spAll');
}
function trackRoundEnd(st){
  const me=myIdx(),rv=st.reveal;if(me<0||!rv)return;
  const key=G.id+':'+rv.round;if(TRK.roundKey===key)return;TRK.roundKey=key;
  const win=rv.winners.includes(me);
  if(win)bump('rw');
  if(rv.declarer===me){if(rv.wrong)bump('talbad');else if(win)bump('talok')}
  if(win&&rv.scores[me]<0)bump('joker');
  if(rv.raw[me]===0)bump('zero');
  if(rv.scores[me]>=80)bump('ruin');
  if(G.local&&win)bump('br');
}
function trackFinish(st){
  const me=myIdx();if(me<0||!st.standings)return;
  const key='f:'+G.id+':'+(st.seq||0);if(TRK.finKey===key)return;TRK.finKey=key;
  const min=st.standings[0].total,mine=st.players[me],win=!mine.left&&mine.total===min;
  const h=new Date().getHours();if(h<5)bump('night');
  if(st.totalRounds>=15)bump('r15');
  if(!mine.left&&mine.total===42)bump('c42');
  if(!G.local&&st.players.length>=6)bump('nido');
  if(win&&mine.total<=10)bump('fino');
  if(win&&st.round>=3&&mine.roundWins>=st.round)bump('clean');
  if(G.local&&!LOCAL.tut){
    bump('bg');if(win){bump('bw');if(LOCAL.diff==='hard')bump('bwT');if(LOCAL.n>=5)bump('bw5')}
  }
  syncProfileSoon();
}

function rectOf(el){return el?el.getBoundingClientRect():null}
function flyCard(r1,r2,card,o){

// Animaciones a partir de eventos (todos los jugadores)
function animEvents(evs){
  const me=myIdx();let k=0;
  evs.forEach(e=>{
    const delay=k*240;
    switch(e.type){
      case 'draw': if(e.p!==me){flyCard(deckRect(),smallRect(boxRect(e.p)),null,{delay,ms:480});play('draw');k++}break;
      case 'keep': if(e.p!==me)flyCard(smallRect(boxRect(e.p)),slotRect(e.p,e.s),null,{delay,ms:380,sound:'place'});
        flyCard(slotRect(e.p,e.s),discRect(),e.card,{delay:delay+(e.p!==me?300:120),ms:520,sound:'discard',rot:10});k++;break;
      case 'discard': if(e.p!==me){flyCard(smallRect(boxRect(e.p)),discRect(),e.card,{delay,ms:520,sound:'discard'});k++}break;
      case 'auto': flyCard(deckRect(),discRect(),e.card,{delay,ms:520,sound:'discard'});k++;break;
      case 'snap': flyCard(slotRect(e.p,e.s),discRect(),e.card,{delay,ms:420,rot:14});k++;break;
      case 'snap_fail': flyCard(deckRect(),slotRect(e.p,e.ps),null,{delay:delay+500,ms:520,sound:'place'});k++;break;
    }
  });
}

// ---------- memoria de los bots ----------
function memOf(b){return LOCAL.mem[b]||(LOCAL.mem[b]={})}
function botLearn(){
  const p=LOCAL.pub,evs=(p.events||[]).filter(e=>e.id>LOCAL.lastEv);
  if(p.events&&p.events.length)LOCAL.lastEv=p.events[p.events.length-1].id;
  const n=p.players.length;
  evs.forEach(e=>{
    for(let b=1;b<n;b++){
      const m=memOf(b);
      switch(e.type){
        case 'round':LOCAL.mem[b]={};LOCAL.snapTry={};break;
        case 'keep':delete m[e.p+'-'+e.s];if(e.p===b&&LOCAL.hold&&LOCAL.hold[b])m[b+'-'+e.s]=LOCAL.hold[b];break;
        case 'snap':delete m[e.p+'-'+e.s];break;
        case 'snap_fail':m[e.p+'-'+e.s]=e.card;delete m[e.p+'-'+e.ps];break;
        case 'swap_blind':case 'k_swap':{const ka=e.a.p+'-'+e.a.s,kb=e.b.p+'-'+e.b.s,va=m[ka],vb=m[kb];delete m[ka];delete m[kb];if(vb!==undefined)m[ka]=vb;if(va!==undefined)m[kb]=va;break}
        case 'reorder':{const old={};e.order.forEach((x,i)=>{old[i]=m[e.p+'-'+x]});e.order.forEach((x,i)=>{delete m[e.p+'-'+i]});for(const i in old)if(old[i]!==undefined)m[e.p+'-'+i]=old[i];break}
      }
    }
    if(e.type==='round')LOCAL.turns=0;
    if(e.type==='draw'||e.type==='auto')LOCAL.turns=(LOCAL.turns||0)+1;
    // los bots también se ríen
    if(!TUT)botBanter(e);
  });
}
function forgetChance(b){const pers=LOCAL.bots[b].pers;if(pers==='memory'||LOCAL.diff==='hard')return 0;if(pers==='forget'||LOCAL.diff==='easy')return .22;return .06}
function botForget(b){const f=forgetChance(b),m=memOf(b);if(!f)return;for(const k in m)if(Math.random()<(k.startsWith(b+'-')?f/2:f))delete m[k]}
const val=c=>TENG.rankValue(c);
function handInfo(b){
  const p=LOCAL.pub,m=memOf(b),sl=p.players[b].slots;let known=0,sum=0,unk=[],worst=-1,worstV=-99;
  sl.forEach((h,s)=>{if(!h)return;const c=m[b+'-'+s];if(c){known++;sum+=val(c);if(val(c)>worstV){worstV=val(c);worst=s}}else unk.push(s)});
  return{known,sum,unk,worst,worstV,count:known+unk.length};
}
function oppTargets(b){const p=LOCAL.pub;return p.players.map((pl,i)=>i).filter(i=>i!==b&&!p.players[i].left&&!(p.talmut&&p.talmut.by===i)&&p.players[i].slots.some(Boolean))}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function thinkMs(){const d=LOCAL.diff;return d==='hard'?600+Math.random()*800:d==='easy'?1100+Math.random()*1400:800+Math.random()*1100}

function botDecide(b){
  const p=LOCAL.pub,pers=LOCAL.bots[b].pers,diff=LOCAL.diff,m=memOf(b),hi=handInfo(b);
  if(p.status==='peek'&&!p.peekDone[b]){const sl=p.players[b].slots;const pick=[2,3].filter(s=>sl[s]);return{action:'peek',slots:pick.length===2?pick:[0,1]}}
  if(p.status!=='play')return null;
  if(p.phase==='draw'&&p.turn===b){
    botForget(b);
    if(!p.talmut){
      const est=hi.sum+hi.unk.length*(pers==='eager'?3:10);
      let call=false;
      if(hi.unk.length===0&&hi.sum<=(diff==='hard'?5:4))call=diff!=='easy'||Math.random()<.7;
      if(pers==='eager'&&est<=6&&hi.unk.length<=1)call=true;
      if(diff==='easy'&&est<14&&Math.random()<.04)call=true;
      if(hi.count===0)call=true;
      const tt=(LOCAL.turns||0)/Math.max(1,p.players.length);
      if(!call&&tt>4&&hi.unk.length<=1&&hi.sum+hi.unk.length*3<=5)call=true;
      if(!call&&tt>6&&hi.sum+hi.unk.length*3<=6)call=true;
      if(!call&&tt>10&&hi.sum+hi.unk.length*3<=8)call=true;
      if(!call&&tt>20)call=true;
      if(call)return{action:'talmut'};
    }
    return{action:'draw'};
  }
  if(p.phase==='decide'&&p.turn===b){
    const c=LOCAL.hold[b],v=val(c);
    if(hi.unk.length&&v<=2)return{action:'keep',slot:rnd(hi.unk)};
    if(hi.worst>=0&&hi.worstV>v)return{action:'keep',slot:hi.worst};
    const lim=diff==='hard'?7:diff==='easy'?4:6;
    if(hi.unk.length&&v<=lim)return{action:'keep',slot:rnd(hi.unk)};
    return{action:'discard'};
  }
  if((p.phase==='special'||p.phase==='special_k2')&&p.special&&p.special.by===b){
    const ty=p.special.type,opp=oppTargets(b);
    if(p.phase==='special_k2'){
      const k=p.special.k,seen=m[k.p+'-'+k.s];
      const myW=hi.worst>=0&&(!hi.unk.length||hi.worstV>=10)?{s:hi.worst,v:hi.worstV}:hi.unk.length?{s:rnd(hi.unk),v:10}:null;
      if(seen!==undefined&&myW&&val(seen)<myW.v-1)return{action:'special',with:{p:b,s:myW.s}};
      return{action:'skip'};
    }
    if(diff==='easy'&&Math.random()<.3)return{action:'skip'};
    if(ty==='10'){if(!hi.unk.length)return{action:'skip'};return{action:'special',slot:rnd(hi.unk)}}
    const unknownOf=i=>p.players[i].slots.map((h,s)=>h&&m[i+'-'+s]===undefined?s:-1).filter(s=>s>=0);
    const anyOf=i=>p.players[i].slots.map((h,s)=>h?s:-1).filter(s=>s>=0);
    if(ty==='J'||ty==='K'){
      if(!opp.length)return{action:'skip'};
      const withUnk=opp.filter(i=>unknownOf(i).length);const i=rnd(withUnk.length?withUnk:opp);
      const ss=unknownOf(i).length?unknownOf(i):anyOf(i);return{action:'special',p:i,s:rnd(ss)};
    }
    if(ty==='Q'){
      if(!opp.length)return{action:'skip'};
      // dar mi peor carta conocida y llevarme una baja conocida (o al azar)
      if(hi.worst>=0&&hi.worstV>=(pers==='nasty'||diff==='hard'?8:15)){
        let best=null;opp.forEach(i=>anyOf(i).forEach(s=>{const c=m[i+'-'+s];if(c!==undefined&&val(c)<hi.worstV-2&&(!best||val(c)<best.v))best={p:i,s,v:val(c)}}));
        if(!best){const i=rnd(opp);best={p:i,s:rnd(anyOf(i))}}
        return{action:'special',a:{p:b,s:hi.worst},b:{p:best.p,s:best.s}};
      }
      if(diff==='easy'&&Math.random()<.5){const i=rnd(opp);const own=anyOf(b);if(own.length)return{action:'special',a:{p:b,s:rnd(own)},b:{p:i,s:rnd(anyOf(i))}}}
      return{action:'skip'};
    }
  }
  return null;
}
function botSnapPlan(){
  const p=LOCAL.pub;if(p.status!=='play'||p.phase!=='snap'||!p.discardTop)return null;
  const top=TENG.rankOf(p.discardTop),key=p.seq+':'+p.discardTop;
  for(let b=1;b<p.players.length;b++){
    if(p.players[b].left)continue;if(p.snap.owner!==null&&p.snap.owner!==b)continue;
    const tk=key+':'+b;if(LOCAL.snapTry[tk])continue;LOCAL.snapTry[tk]=1;
    const m=memOf(b),sl=p.players[b].slots;
    let s=sl.findIndex((h,i)=>h&&m[b+'-'+i]&&TENG.rankOf(m[b+'-'+i])===top);
    const pr=LOCAL.diff==='hard'?.95:LOCAL.diff==='easy'?.4:.75;
    if(s<0&&LOCAL.diff==='easy'&&Math.random()<.06){const any=sl.map((h,i)=>h&&!m[b+'-'+i]?i:-1).filter(i=>i>=0);if(any.length)s=rnd(any)}
    if(s>=0&&Math.random()<pr){const d=LOCAL.diff==='hard'?350+Math.random()*600:600+Math.random()*1300;return{b,a:{action:'snap',slot:s},at:Date.now()+d}}
  }
  return null;
}
function botRun(b,a){
  const L0=LOCAL;if(!L0)return;
  try{
    const r=TENG.act(L0.pub,L0.sec,b,a,Date.now());const pv=r.priv||{};
    L0.hold=L0.hold||{};
    if(a.action==='draw'&&pv.card)L0.hold[b]=pv.card;
    if(pv.cards)pv.cards.forEach(c=>{memOf(b)[b+'-'+c.s]=c.card});
    if(pv.look)memOf(b)[pv.look.p+'-'+pv.look.s]=pv.look.card;
    if(a.action==='snap'&&pv.ok)delete memOf(b)[b+'-'+a.slot];
    if(r.changed)localPush();
    if(a.action==='special'&&L0.pub.events){const e=L0.pub.events[L0.pub.events.length-1];if(e&&(e.type==='look_other')&&Math.random()<.3){const ty=(L0.pub.special&&L0.pub.special.type)||'J';setTimeout(()=>LOCAL&&botSay(b,ty==='K'?'usa':'ajena'),700)}}
  }catch(e){}
}
function botTick(){
  const L0=LOCAL;if(!L0||!G)return;
  if(TUT){tutBotTick();return}
  const p=L0.pub,now=Date.now();
  if(L0.sched){if(now<L0.sched.at)return;const s=L0.sched;L0.sched=null;if(L0.ver===s.seq)botRun(s.b,s.a);return}
  if(p.status==='peek'){for(let b=1;b<p.players.length;b++)if(!p.peekDone[b]&&!p.players[b].left){const a=botDecide(b);if(a){L0.sched={b,a,at:now+600+Math.random()*900,seq:L0.ver};return}}return}
  if(p.status!=='play')return;
  if(p.phase==='snap'){const sp=botSnapPlan();if(sp){L0.sched=Object.assign(sp,{seq:L0.ver});}return}
  const who=(p.phase==='special'||p.phase==='special_k2')&&p.special?p.special.by:p.turn;
  if(who>0&&!p.players[who].left){const a=botDecide(who);if(a)L0.sched={b:who,a,at:now+thinkMs(),seq:L0.ver}}
}
// reacciones de los bots
function botSay(b,k){if(!LOCAL||!G||!LOCAL.pub.players[b])return;showReact(b,k)}
function botBanter(e){
  if(!LOCAL||Math.random()>.35)return;
  const p=LOCAL.pub,n=p.players.length,others=x=>[...Array(n).keys()].filter(i=>i>0&&i!==x&&!p.players[i].left);
  let k=null,who=null;
  if(e.type==='snap_fail'){who=rnd(others(e.p));k=rnd(['ufff','nohombre'])}
  else if(e.type==='snap'&&e.p===0){who=rnd(others(0));k=rnd(['aguila','suerte'])}
  else if(e.type==='talmut'&&e.p!==0&&!e.auto&&Math.random()<.5){who=e.p;k='creer'}
  else if(e.type==='round_end'){const rv=p.reveal;if(rv&&rv.winners.includes(0)){who=rnd(others(0));k=rnd(['enhora','suerte'])}else if(rv&&rv.wrong&&rv.declarer>0){who=rnd(others(rv.declarer));k='nohombre'}}
  if(k&&who!=null&&who>0)setTimeout(()=>botSay(who,k),900+Math.random()*900);
}
function botReply(k){if(!LOCAL||TUT||Math.random()>.5)return;const p=LOCAL.pub;const bs=[...Array(p.players.length).keys()].filter(i=>i>0);const b=rnd(bs);const ans={ufff:'nohombre',nohombre:'ufff',aguila:'suerte',enhora:'suerte',suerte:'nohombre',creer:'ufff',ajena:'nohombre',usa:'nohombre'}[k];if(ans)setTimeout(()=>botSay(b,ans),1200+Math.random()*800)}

const TUT_DECK=['2C','3S','10H','6D','JD','5C','QC','4H','KH','9C','7D'];
const TUT_BOT=[['draw','discard'],['draw',{keep:3}],['draw','discard'],['draw','discard'],['draw','discard'],['draw','discard'],['draw','discard']];
function startTutorial(){
  stopLocal();unsubscribe();
  Object.assign(TENG.T,{peek:9e8,draw:9e8,decide:9e8,special:9e8,snap:9e8,roundEnd:9e8});
  const now=Date.now(),room=TENG.newRoom({uid:'me',name:myName()},{rounds:1,isPublic:false},now);
  TENG.addPlayer(room.pub,room.sec,{uid:'bot0',name:'El Profe'},now);AVC['El Profe']='#C77A1E';
  const p=room.pub,sec=room.sec;p.round=1;p.startIdx=0;TENG.startRound(p,sec,now);
  sec.hands=[['KS','9H','3D','7C'],['AS','2H','QD','8S']];
  const used=new Set([...sec.hands[0],...sec.hands[1],...TUT_DECK]);
  const filler=TENG.newDeck().filter(c=>!used.has(c));
  sec.deck=[...filler,...TUT_DECK.slice().reverse()];sec.discard=[];TENG.sync(p,sec);
  LOCAL={pub:p,sec,ver:0,diff:'normal',n:1,bots:[null,{name:'El Profe',pers:'calm'}],mem:[],sched:null,snapTry:{},lastEv:0,tut:true,hold:{}};
  TUT={i:0,botQ:TUT_BOT.map(x=>x.slice()),wait:0};
  localEnter();tutShow();
}
function tutStep(){return TUT&&TUT_STEPS[TUT.i]}
function tutShow(){
  document.querySelectorAll('.coach').forEach(e=>e.remove());const s=tutStep();if(!s)return;
  const d=document.createElement('div');d.className='coach'+(['jack2','queen2','king2'].includes(s.id)?' low':s.id==='end'?' bot':'');
  d.innerHTML=`<div class="jj">${juanjoSvg(s.fin?'cheer':'talk')}</div><div class="cb"><span class="stp">JUANJO, EL CUERVO · ${TUT.i+1}/${TUT_STEPS.length}</span><b>${s.t}</b><p>${s.d}</p>`+
   (s.next?`<div class="row"><button class="gh" onclick="tutQuit()">${L('Salir','Quit')}</button><button onclick="tutNext()">${L('Siguiente','Next')} ›</button></div>`:'')+
   (s.fin?`<div class="row"><button class="gh" onclick="tutQuit()">${L('Menú','Menu')}</button><button onclick="tutQuit(1)">${L('Jugar en ARCADE','Play ARCADE')} ›</button></div>`:'')+'</div>';
  document.body.appendChild(d);if(TUT.i===0||s.fin||Math.random()<.25)play('caw');
  if(G)renderGame();
}
function tutLater(ms){const i=TUT.i;if(TUT.later===i)return;TUT.later=i;setTimeout(()=>{if(TUT&&TUT.i===i)tutNext()},ms)}
function tutNext(){if(!TUT)return;TUT.i++;TUT.t0=Date.now();play('select');tutShow();tutState()}
function tutQuit(toBots){const done=TUT&&tutStep()&&tutStep().fin;if(done)bump('tut');stopLocal();G=null;if(toBots)openBots();else goMenu()}
function tutGo(w){const s=tutStep();if(s&&s.wait===w)tutNext()}
// qué se puede tocar en cada paso
function tutAllowTap(pi,s){
  const st=tutStep();if(!st)return false;
  switch(st.id){
    case 'peek':return pi===0&&(s===2||s===3);
    case 'keep1':return pi===0&&s===3;
    case 'snap':return pi===0&&s===2;
    case 'ten2':return pi===0&&s===0;
    case 'jack2':return pi===1&&s===0;
    case 'queen2':return UI.qFirst?(pi===1&&s===0):(pi===0&&s===0);
    case 'king2':return pi===1&&s===1;
    case 'king3':return pi===0&&s===1;
  }
  return false;
}
function tutAllow(what){
  const st=tutStep();if(!st)return false;
  if(what==='draw')return st.wait==='drew';
  if(what==='discard')return st.wait==='special';
  if(what==='talmut')return st.id==='talmut';
  if(what==='skip'||what==='order')return false;
  return false;
}
function tutEvent(k){const s=tutStep();if(!s)return;if(k==='drew'&&s.wait==='drew')tutNext()}
// reacciona a cada cambio de estado
function tutState(){
  const s=tutStep();if(!s||!LOCAL)return;const p=LOCAL.pub;
  if(s.wait==='peeked'&&p.status==='play'){tutLater(1600)}
  if(s.wait==='kept'&&p.phase==='snap'){p.deadline=Date.now()+600;tutNext()}
  if(s.wait==='special'&&(p.phase==='special'))tutNext();
  if(s.wait==='looked'&&(p.phase==='snap'||p.phase==='special_k2')){if(p.phase==='snap')p.deadline=Date.now()+900;tutLater(700)}
  if(s.wait==='swapped'&&p.phase==='snap'){p.deadline=Date.now()+900;tutLater(900)}
  if(s.wait==='snapped'&&p.phase==='snap'&&p.snap&&p.snap.owner===0){p.deadline=Date.now()+1200;tutNext()}
  if(s.wait==='botsnap'&&p.phase==='snap'&&p.snap&&p.snap.actor===1&&p.discardTop==='3S'){tutNext()}
  if(s.wait==='myturn'&&p.phase==='draw'&&p.turn===0)tutNext();
  if(s.wait==='talmut'&&p.talmut)tutLater(2600);
  if(s.wait==='end'&&p.status==='round_end')tutLater(3500);
  // ventanas de descarte rápido que no enseñan nada: se cierran solas
  if(p.phase==='snap'&&p.deadline>Date.now()+60000){const st=tutStep();if(!st||st.wait!=='snapped')p.deadline=Date.now()+(p.snap.actor===1?1100:800)}
  if(G&&G.local&&G.pub.status===p.status)G.pub.deadline=p.deadline;
}
function tutBotTick(){
  const L0=LOCAL,p=L0.pub,now=Date.now();
  if(L0.sched){if(now<L0.sched.at)return;const s=L0.sched;L0.sched=null;botRun(1,s.a);return}
  if(p.status==='peek'&&!p.peekDone[1]){botRun(1,{action:'peek',slots:[2,3]});return}
  if(p.status!=='play'||p.turn!==1)return;
  const st=tutStep();if(!st||!st.bot)return;
  const q=TUT.botQ[0];if(!q)return;
  if(p.phase==='draw'){L0.sched={a:{action:'draw'},at:now+1100}}
  else if(p.phase==='decide'){const x=q[1];TUT.botQ.shift();L0.sched={a:x==='discard'?{action:'discard'}:{action:'keep',slot:x.keep},at:now+1300}}
}

// ---------- graznido sintetizado ----------
SFX.caw=function(){
  const c=SND.ctx;[0,.3].forEach((t0,i)=>{
    const t=c.currentTime+t0,o=c.createOscillator(),o2=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),g=c.createGain(),f=c.createBiquadFilter(),f2=c.createBiquadFilter(),mix=c.createGain();
    const p=i?470:540;
    o.type='sawtooth';o.frequency.setValueAtTime(p,t);o.frequency.linearRampToValueAtTime(p*1.08,t+.05);o.frequency.exponentialRampToValueAtTime(p*.68,t+.24);
    o2.type='square';o2.frequency.setValueAtTime(p*1.5,t);o2.frequency.exponentialRampToValueAtTime(p*.95,t+.24);
    lfo.frequency.value=62;lg.gain.value=.5;lfo.connect(lg);lg.connect(g.gain);
    f.type='bandpass';f.frequency.value=1250;f.Q.value=3;f2.type='bandpass';f2.frequency.value=2700;f2.Q.value=4;
    o.connect(f);o2.connect(f);o.connect(f2);f.connect(mix);f2.connect(mix);mix.gain.value=.9;mix.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.025);g.gain.setValueAtTime(.28,t+.14);g.gain.exponentialRampToValueAtTime(.0001,t+.27);
    g.connect(SND.master);g.connect(SND.rev);
    [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+.3)});
    noise({t:t0,f:2000,q:1.4,a:.01,d:.2,v:.08});
  });
};

function withDiff(fn){return function(){if(!LOCAL)return fn.apply(this,arguments);const d=LOCAL.diff;LOCAL.diff=d==='easy'?'normal':'hard';try{return fn.apply(this,arguments)}finally{LOCAL.diff=d}}}

const _btk=botTick;botTick=function(){
  const L0=LOCAL;
  if(L0&&G&&!TUT&&!L0.sched){const p=L0.pub;
    if(p.status==='play'&&p.phase==='draw'&&p.lastSnap){
      const ph=p.phase,sn=p.snap;p.phase='snap';p.snap=p.lastSnap;let sp=null;
      try{sp=botSnapPlan()}finally{p.phase=ph;p.snap=sn}
      if(sp){L0.sched=Object.assign(sp,{seq:L0.ver});return}
    }}
  return _btk.apply(this,arguments);
};

const _fc9=forgetChance;forgetChance=function(b){return LOCAL&&LOCAL.diff==='french'?0:_fc9.apply(this,arguments)};
const _tm9=thinkMs;thinkMs=function(){return LOCAL&&LOCAL.diff==='french'?380+Math.random()*520:_tm9.apply(this,arguments)};
const _bd9=botDecide;botDecide=function(b){
  if(!LOCAL||LOCAL.diff!=='french')return _bd9.apply(this,arguments);
  const p=LOCAL.pub;
  try{
    if((p.phase==='special'||p.phase==='special_k2')&&p.special&&p.special.by===b){
      const ty=p.special.type,m=memOf(b),hi=handInfo(b),you=0;
      const canHit=oppTargets(b).includes(you);
      const yourSlots=p.players[you].slots.map((h,s)=>h?s:-1).filter(s=>s>=0);
      const yourUnk=yourSlots.filter(s=>m[you+'-'+s]===undefined);
      if(p.phase==='special_k2'){
        const k=p.special.k;if(!k||k.p!==you)return _bd9.apply(this,arguments);
        const seen=m[you+'-'+k.s];
        const mine=hi.worst>=0?{s:hi.worst,v:hi.worstV}:hi.unk.length?{s:rnd(hi.unk),v:8}:null;
        // te quita tu carta buena y te deja su peor carta
        if(mine&&(seen===undefined||val(seen)<mine.v||mine.v>=7))return{action:'special',with:{p:b,s:mine.s}};
        return{action:'skip'};
      }
      if((ty==='J'||ty==='K')&&canHit){
        const ss=yourUnk.length?yourUnk:yourSlots;
        return{action:'special',p:you,s:rnd(ss)};
      }
      if(ty==='Q'&&canHit){
        // cambio a ciegas: te da su peor carta y se lleva tu carta más baja conocida
        let tgt=null;yourSlots.forEach(s=>{const c=m[you+'-'+s];if(c!==undefined&&(!tgt||val(c)<tgt.v))tgt={s,v:val(c)}});
        if(!tgt)tgt={s:rnd(yourSlots),v:5};
        const own=hi.worst>=0?hi.worst:(hi.unk.length?rnd(hi.unk):null);
        if(own!==null&&yourSlots.length)return{action:'special',a:{p:b,s:own},b:{p:you,s:tgt.s}};
      }
    }
  }catch(e){}
  return _bd9.apply(this,arguments);
};

    const tb=document.querySelector('#screen-setup .topbar');if(tb&&!tb.querySelector('.hist-btn')){const sp=tb.querySelector('.spacer36');const b=document.createElement('button');b.className='iconbtn hist-btn';b.title=L('Histórico','History');b.innerHTML='📜';b.onclick=()=>openHist();if(sp)sp.replaceWith(b);else tb.appendChild(b)}
  }catch(e){}
  return r;
};
const _ss81=startScorer;startScorer=function(){
  const r=_ss81.apply(this,arguments);
  try{if(M&&setup.useUsers&&setup.uids){M.players.forEach(p=>{if(setup.uids[p.name])p.uid=setup.uids[p.name]});M.byUid=session&&session.user&&session.user.id;saveM()}}catch(e){}
  return r;
};
const _fs81=finishScorer;finishScorer=function(){
  const m=M;let rec=null;
  try{if(m&&m.players.some(p=>p.uid)&&sb&&session&&!session.user.is_anonymous){
    const totals=playerTotals();
    const players=m.players.map(p=>({uid:p.uid||null,name:p.name,total:totals[p.id],rounds:Object.keys(m.scores).sort((a,b)=>a-b).map(r=>m.scores[r][p.id]??null)}));
    const min=Math.min(...players.map(p=>p.total));
    rec={created_by:session.user.id,mode:m.type,rounds:m.totalRounds,players,player_ids:[...new Set(players.map(p=>p.uid).filter(Boolean))],winner_ids:players.filter(p=>p.total===min&&p.uid).map(p=>p.uid)};
  }}catch(e){}
  const r=_fs81.apply(this,arguments);
  if(rec)sb.from('local_games').insert(rec).then(({error})=>{if(error)toast(L('No se pudo guardar en el histórico','Could not save to history'),'bad');else toast(L('Partida guardada en el histórico de todos','Game saved in everyone’s history'),'good')});
  return r;
};

// ---------- HISTÓRICO de partidas locales ----------
(function(){if(document.getElementById('screen-hist2'))return;const s=document.createElement('div');s.id='screen-hist2';s.className='screen';
  s.innerHTML=`<div class="topbar"><button class="iconbtn" onclick="openSetup()"><svg width="8" height="14" viewBox="0 0 8 14"><polyline points="7,1 1,7 7,13" fill="none" stroke="#D4A83A" stroke-width="1.6" stroke-linecap="round"/></svg></button><div class="ttl"><h1>${L('Histórico','History')}</h1><p>${L('Partidas locales con usuarios','Local games with users')}</p></div><div class="spacer36"></div></div><div class="divider"></div><div id="hist2Body" class="pad"></div>`;
  document.body.appendChild(s)})();
const HIST={rows:[],filter:'all'};
async function openHist(){
  showScreen('screen-hist2');const b=document.getElementById('hist2Body');
  if(!sb||!await ensureSession()||session.user.is_anonymous){b.innerHTML=`<div class="on-box" style="grid-template-columns:1fr;text-align:center"><p class="lu-note">${L('Entra con Google para ver tu histórico.','Sign in with Google to see your history.')}</p><button class="btn btn-gold" onclick="signInGoogle()">${L('Entrar con Google','Sign in with Google')}</button></div>`;return}
  b.innerHTML='<div style="text-align:center;padding:30px"><span class="spinner"></span></div>';
  const{data,error}=await sb.from('local_games').select('id,mode,rounds,players,winner_ids,played_at').order('played_at',{ascending:false}).limit(200);
  if(error){b.innerHTML=`<div class="on-box" style="grid-template-columns:1fr"><p class="lu-note" style="text-align:center">${L('El histórico aún no está activado en el servidor.','History is not enabled on the server yet.')}</p></div>`;return}
  HIST.rows=data||[];histRender();
}
function histRender(){
  const b=document.getElementById('hist2Body');const me=session.user.id;
  const now=new Date(),rows=HIST.rows.filter(g=>HIST.filter==='all'||(HIST.filter==='off'&&g.mode==='official')||(HIST.filter==='year'&&new Date(g.played_at).getFullYear()===now.getFullYear()));
  const st={};rows.forEach(g=>(g.players||[]).forEach(p=>{if(!p.uid)return;const s=st[p.uid]=st[p.uid]||{name:p.name,n:0,w:0,pts:0};s.name=p.name;s.n++;s.pts+=p.total||0;if((g.winner_ids||[]).includes(p.uid))s.w++}));
  const rank=Object.entries(st).sort((a,b)=>b[1].w-a[1].w||(a[1].pts/a[1].n)-(b[1].pts/b[1].n));
  const fmt=d=>new Date(d).toLocaleDateString(LANG==='en'?'en-GB':'es-ES',{weekday:'short',day:'numeric',month:'short'});
  const list=rows.length?rows.map(g=>{const ps=g.players||[];const min=Math.min(...ps.map(p=>p.total));const w=ps.find(p=>p.total===min)||{name:'?'};
    return `<button class="h2-row" onclick="histOpen('${g.id}')"><div class="h2-d"><b>${fmt(g.played_at)}</b><small>${g.mode==='official'?L('Oficial','Official'):L('Libre','Free')} · ${g.rounds} ${L('rondas','rounds')}</small></div><span class="sala-avs">${ps.map(p=>avatar(p.name,20)).join('')}</span><span class="h2-w">${avatar(w.name,20)}<b>${esc(w.name)}</b></span><span class="h2-p">${min}</span></button>`}).join(''):`<p class="lu-note" style="text-align:center;padding:16px">${L('Aún no hay partidas. Juega una en LOCAL con usuarios de TALMUT.','No games yet. Play one in LOCAL with TALMUT users.')}</p>`;
  b.innerHTML=`<div class="on-box h2-box"><div class="on-col"><p class="sala-lbl">${L('Partidas locales','Local games')} · ${rows.length}</p><div class="h2-list">${list}</div></div>
   <div class="on-col"><p class="sala-lbl">${L('Clasificación histórica','All-time ranking')}</p><div class="h2-rank">${rank.map(([id,s])=>`<div class="sala-mem${id===me?' me':''}">${avatar(s.name,24)}<b>${esc(s.name)}</b><span class="h2-fs"><span class="fs"><b>${s.n}</b><i>${L('partidas','games')}</i></span><span class="fs"><b>${s.w}</b><i>${L('victorias','wins')}</i></span><span class="fs"><b>${Math.round(s.pts/s.n)}</b><i>${L('media','avg')}</i></span></span></div>`).join('')||''}</div>
   <div class="sala-pills" style="margin-top:auto">${[['all',L('Todo','All')],['off',L('Oficiales','Official')],['year',L('Este año','This year')]].map(([k,l])=>`<button class="${HIST.filter===k?'on':''}" onclick="HIST.filter='${k}';histRender()">${l}</button>`).join('')}</div></div></div>`;
}
function histOpen(id){
  const g=HIST.rows.find(x=>x.id===id);if(!g)return;const ps=g.players||[];const n=Math.max(...ps.map(p=>(p.rounds||[]).length));
  const d=document.createElement('div');d.className='sala-modal';d.onclick=e=>{if(e.target===d)d.remove()};
  d.innerHTML=`<div class="sala-box" style="width:min(640px,100%)"><p class="sala-lbl">${new Date(g.played_at).toLocaleString(LANG==='en'?'en-GB':'es-ES')}</p><div class="h2-tbl"><table><tr><th>#</th>${ps.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>${[...Array(n).keys()].map(r=>`<tr><td>${r+1}</td>${ps.map(p=>`<td>${(p.rounds||[])[r]??'—'}</td>`).join('')}</tr>`).join('')}<tr class="tot"><td>Σ</td>${ps.map(p=>`<td>${p.total}</td>`).join('')}</tr></table></div><button class="btn btn-ghost" style="margin-top:10px" onclick="this.closest('.sala-modal').remove()">${L('Cerrar','Close')}</button></div>`;
  document.body.appendChild(d);
}
