// ---------- ordenar mis cartas boca abajo ----------
function canOrder(){if(!G)return false;const p=G.pub,me=myIdx();return me>=0&&['peek','play'].includes(p.status)&&!p.players[me].left&&p.players[me].slots.filter(Boolean).length>1}
function toggleOrder(){UI.ordering=!UI.ordering&&canOrder();UI.oSel=null;renderGame()}
// mueve lo que "recuerdas" (cartas visibles, destellos) junto con las cartas
function moveKnown(pi,order){
  for(const bag of [UI.flash,UI.hl]){
    const old={};order.forEach((x,i)=>{const k=pi+'-'+x;if(k in bag)old[i]=bag[k]});
    order.forEach((x,i)=>{delete bag[pi+'-'+x]});
    for(const i in old)bag[pi+'-'+i]=old[i];
  }
}
async function orderTap(pi,s){
  const me=myIdx();
  if(pi!==me||!canOrder())return;
  if(UI.oSel===null){UI.oSel=s;play('tap');renderGame();return}
  if(UI.oSel===s){UI.oSel=null;renderGame();return}
  const n=G.pub.players[me].slots.length,order=[...Array(n).keys()];
  order[UI.oSel]=s;order[s]=UI.oSel;UI.oSel=null;
  // movimiento inmediato en pantalla; el servidor confirma
  const sl=G.pub.players[me].slots;[sl[order[s]],sl[s]]=[sl[s],sl[order[s]]];
  moveKnown(me,order);buzz(25);play('slide');renderGame();
  const r=await act('reorder',{order});
  if(!r||r.error){[sl[order[s]],sl[s]]=[sl[s],sl[order[s]]];moveKnown(me,order);renderGame()}
}

// ---------- cartas ----------
function cardHtml(card,o){
  o=o||{};
  const cls=['pc'];if(o.size)cls.push(o.size);if(card)cls.push('up');if(o.click)cls.push('click');if(o.sel)cls.push('sel');if(o.flash)cls.push('flash');if(o.empty)cls.push('empty');
  let face='';
  if(card){
    if(card[0]==='X'){face=`<div class="face${card==='XR'?' red':''}"><span class="s">★</span><span class="jk">JOKER</span></div>`}
    else{const r=card.slice(0,-1),s=card.slice(-1),sym={S:'♠',H:'♥',D:'♦',C:'♣'}[s],red=s==='H'||s==='D';face=`<div class="face${red?' red':''}"><span class="c">${r}${sym}</span><span class="r">${r}</span><span class="s">${sym}</span></div>`}
  }else face='<div class="face"></div>';
  const on=o.onclick?` onclick="${o.onclick}"`:'';
  return `<div class="${cls.join(' ')}"${on}>${face}<div class="back"></div></div>`;
}

// Qué cartas se pueden tocar ahora mismo
function canTap(pi,s){
  const p=G.pub,me=myIdx();
  const has=p.players[pi]&&p.players[pi].slots[s];
  if(!has||me<0||p.players[me].left)return false;
  const immune=p.talmut&&p.talmut.by===pi;
  const oppOk=pi!==me&&!p.players[pi].left&&!immune;
  if(p.status==='peek')return pi===me&&!p.peekDone[me];
  if(p.status!=='play')return false;
  if(p.phase==='decide'&&p.turn===me)return pi===me;
  if(p.phase==='snap')return pi===me&&(p.snap.owner===null||p.snap.owner===me);
  if(p.special&&p.special.by===me){
    if(p.phase==='special'){
      const ty=p.special.type;
      if(ty==='10')return pi===me;
      if(ty==='J'||ty==='K')return oppOk;
      if(ty==='Q'){if(!(pi===me||oppOk))return false;if(UI.qFirst&&UI.qFirst.p===pi)return UI.qFirst.s===s;return true}
    }
    if(p.phase==='special_k2'){const k=p.special.k;return pi!==k.p&&(pi===me||oppOk)}
  }
  return false;
}
async function tapCard(pi,s){
  if(UI.ordering){return orderTap(pi,s)}
  if(!G||!canTap(pi,s)||inFlightAction)return;
  const p=G.pub,me=myIdx();
  if(p.status==='peek'){
    const i=UI.peekSel.indexOf(s);if(i>=0)UI.peekSel.splice(i,1);else UI.peekSel.push(s);
    play('tap');renderGame();
    if(UI.peekSel.length===2){const sel=UI.peekSel.slice();const r=await act('peek',{slots:sel});if(r&&r.priv&&r.priv.cards)r.priv.cards.forEach(c=>{UI.flash[me+'-'+c.s]={card:c.card,until:Date.now()+3500}});play('flip');SFX_later('flip',.12);UI.peekSel=[];renderGame()}
    return;
  }
  if(p.phase==='decide'){await act('keep',{slot:s});return}
  if(p.phase==='snap'){const r=await act('snap',{slot:s});if(r&&r.priv&&r.priv.ok===false)buzz(200);return}
  if(p.phase==='special'){
    const ty=p.special.type;
    if(ty==='10'){const r=await act('special',{slot:s});handlePriv(r&&r.priv);return}
    if(ty==='J'||ty==='K'){const r=await act('special',{p:pi,s});handlePriv(r&&r.priv);return}
    if(ty==='Q'){
      if(!UI.qFirst){UI.qFirst={p:pi,s};play('tap');renderGame();return}
      if(UI.qFirst.p===pi&&UI.qFirst.s===s){UI.qFirst=null;renderGame();return}
      if(UI.qFirst.p===pi){UI.qFirst={p:pi,s};renderGame();return}
      const a=UI.qFirst;UI.qFirst=null;await act('special',{a,b:{p:pi,s}});return;
    }
  }
  if(p.phase==='special_k2'){await act('special',{with:{p:pi,s}});return}
}
let inFlightAction=false;
async function act(action,payload){inFlightAction=true;try{return await api(action,payload)}finally{inFlightAction=false}}
function handlePriv(pv){
  if(!pv)return;
  if(pv.pending)UI.pending=pv.pending;
  if(pv.look){play('flip');UI.flash[pv.look.p+'-'+pv.look.s]={card:pv.look.card,until:Date.now()+(G&&G.pub.phase==='special_k2'?20000:3500)}}
  renderGame();
}
async function doDraw(){play('draw');const r=await act('draw');if(r&&r.priv&&r.priv.card){UI.pending=r.priv.card;renderGame()}}
async function doDiscard(){UI.pending=null;await act('discard')}
async function doTalmut(){play('tap');await act('talmut')}
async function doSkip(){play('tap');for(const k in UI.flash)delete UI.flash[k];UI.qFirst=null;await act('skip')}

const POWER_TXT={es:{'10':'mirar una de tus cartas','J':'mirar una carta de un rival','Q':'intercambiar dos cartas a ciegas','K':'mirar una carta de un rival y moverla'},en:{'10':'look at one of your cards','J':'look at an opponent’s card','Q':'blindly swap two cards','K':'look at an opponent’s card and move it'}};
function rankOfC(c){return c[0]==='X'?'X':c.slice(0,-1)}

// ---------- mesa ----------
function renderGame(){
  if(!G||currentScreen()!=='screen-game')return;
  const p=G.pub,me=myIdx(),meP=p.players[me];
  document.getElementById('gRound').innerHTML=(p.tiebreak&&p.round>p.baseRounds?t('g.tiebreak'):t('g.round',{r:Math.max(1,p.round),t:p.totalRounds}))+(p.talmut?`<small style="color:#F08A8A">${t('g.talmutOn',{n:pname(p.talmut.by)})}</small>`:`<small>${esc(G.code||'')}</small>`);
  // rivales (en orden de juego empezando por el siguiente a mí)
  const n=p.players.length,order=[];
  for(let k=1;k<n;k++)order.push((Math.max(me,0)+k)%n);
  const oppEl=document.getElementById('gOpps');
  oppEl.className='opps n'+Math.min(5,order.length);
  oppEl.innerHTML=order.map(i=>{
    const pl=p.players[i],isTurn=p.status==='play'&&p.turn===i,immune=p.talmut&&p.talmut.by===i;
    const cards=pl.slots.map((has,s)=>{
      if(!has)return cardHtml(null,{size:'sm',empty:true});
      const f=UI.flash[i+'-'+s];
      return cardHtml(f?f.card:null,{size:'sm',click:canTap(i,s),sel:UI.qFirst&&UI.qFirst.p===i&&UI.qFirst.s===s,flash:!!UI.hl[i+'-'+s],onclick:`tapCard(${i},${s})`});
    }).join('');
    return `<div class="opp${isTurn?' turn':''}${pl.left?' gone':''}"><div class="who">${avatar(pl.name,18)}<span>${esc(pl.name)}</span></div><div class="pts">${t('g.pts',{n:pl.total})}${immune?` · <span class="shield">${t('g.immune')}</span>`:''}${pl.left?' · '+t('g.left'):''}</div><div class="row">${cards}</div></div>`;
  }).join('');
  // centro
  let piles=`<div class="pile">${p.deckCount>0?cardHtml(null,{}):'<div class="pile-empty"></div>'}<small>${t('g.deck')} · ${p.deckCount}</small></div>`;
  if(p.phase==='decide'&&p.turn===me&&UI.pending)piles+=`<div class="drawn-wrap">${cardHtml(UI.pending,{size:'lg'})}<small>${t('g.drawn')}</small></div>`;
  piles+=`<div class="pile">${p.discardTop?cardHtml(p.discardTop,{flash:p.phase==='snap'}):`<div class="pile-empty">${t('g.discard')}</div>`}<small>${t('g.discard')}</small></div>`;
  document.getElementById('gPiles').innerHTML=piles;
  // mis cartas
  document.getElementById('gMeName').innerHTML=meP?`<b>${esc(meP.name)}</b>${p.talmut&&p.talmut.by===me?` · <span class="shield">${t('g.immune')}</span>`:''}`:'';
  document.getElementById('gMePts').textContent=meP?t('g.pts',{n:meP.total}):'';
  document.getElementById('gMe').innerHTML=meP?meP.slots.map((has,s)=>{
    if(!has)return cardHtml(null,{empty:true});
    const f=UI.flash[me+'-'+s];
    return cardHtml(f?f.card:null,{click:canTap(me,s),sel:UI.peekSel.includes(s)||(UI.qFirst&&UI.qFirst.p===me&&UI.qFirst.s===s),flash:!!UI.hl[me+'-'+s],onclick:`tapCard(${me},${s})`});
  }).join(''):'';
  // ordenar cartas
  if(UI.ordering&&!canOrder()){UI.ordering=false;UI.oSel=null}
  document.getElementById('gMe').classList.toggle('ordering',UI.ordering);
  if(UI.ordering&&UI.oSel!==null){const el=document.getElementById('gMe').children[UI.oSel];if(el)el.classList.add('osel')}
  document.getElementById('gOrder').innerHTML=canOrder()?`<button class="order-btn${UI.ordering?' on':''}" onclick="toggleOrder()">${UI.ordering?'✓ '+t('g.orderOn'):'⇄ '+t('g.order')}</button>`+(UI.ordering?`<p class="muted" style="margin:6px 0 0;font-size:11px;text-align:center;width:100%">${t('g.orderHint')}</p>`:''):'';
  renderActions();
  renderOverlay();
}
function renderActions(){
  const p=G.pub,me=myIdx(),el=document.getElementById('gActions'),st=document.getElementById('gStatus');
  let hint='',btns='',status='';
  const turnName=pname(p.turn);
  if(p.status==='peek'){
    hint=p.peekDone[me]?t('g.peekWait'):t('g.peek');
  }else if(p.status==='play'){
    const myTurn=p.turn===me;
    if(p.phase==='draw'){
      if(myTurn){hint=t('g.yourTurn');btns=`<button class="btn btn-gold" onclick="doDraw()">${t('g.draw')}</button>${!p.talmut?`<button class="btn btn-talmut" onclick="doTalmut()">${t('g.talmut')}</button>`:''}`}
      else status=t('g.waitTurn',{n:turnName});
    }else if(p.phase==='decide'){
      if(myTurn){
        hint=t('g.decide');
        if(UI.pending){const r=rankOfC(UI.pending);if(['10','J','Q','K'].includes(r))hint+='<br><span style="color:var(--gold2)">'+t('g.decideSp',{p:POWER_TXT[LANG][r]})+'</span>'}
        btns=`<button class="btn btn-ghost" onclick="doDiscard()">${t('g.discardBtn')}</button>`;
      }else status=t('g.waitDecide',{n:turnName});
    }else if(p.phase==='special'||p.phase==='special_k2'){
      const sp=p.special;
      if(sp.by===me){
        if(p.phase==='special_k2'){hint=t('g.spK2');btns=`<button class="btn btn-ghost" onclick="doSkip()">${t('g.noSwap')}</button>`}
        else{hint=sp.type==='Q'?(UI.qFirst?t('g.spQ2'):t('g.spQ1')):t('g.sp'+sp.type);btns=`<button class="btn btn-ghost" onclick="doSkip()">${t('g.noUse')}</button>`}
      }else status=t('g.waitSpecial',{n:pname(sp.by),c:sp.type});
    }else if(p.phase==='snap'){
      const r=p.discardTop?(p.discardTop[0]==='X'?'JOKER':p.discardTop.slice(0,-1)):'';
      hint=t('g.snap',{r});
      if(p.snap.actor===me&&!p.talmut)btns=`<button class="btn btn-talmut" onclick="doTalmut()">${t('g.talmut')}</button>`;
      status=t('g.snapOwn',{r});
    }
  }
  st.innerHTML=status;
  el.innerHTML=(hint?`<div class="hint">${hint}</div>`:'')+(btns?`<div class="btn-row">${btns}</div>`:'');
  el.style.display=(hint||btns)?'flex':'none';
}
function renderOverlay(){
  const p=G.pub,ov=document.getElementById('gOverlay'),me=myIdx();
  if(p.status==='round_end'&&p.reveal){
    const rv=p.reveal,isHost=p.players[me]&&p.players[me].uid===p.hostUid;
    const rows=p.players.map((pl,i)=>({pl,i,sc:rv.scores[i]})).sort((a,b)=>a.pl.total-b.pl.total);
    let h=`<h2 style="margin:0 0 4px;text-align:center;font-family:var(--fd);color:var(--cream);letter-spacing:2px">${t('g.roundEnd',{r:rv.round})}</h2>`;
    if(rv.wrong)h+=`<p style="text-align:center;color:#F08A8A;font-size:13px;margin:4px 0 0">${t('g.wrong',{n:pname(rv.declarer)})}</p>`;
    h+='<div style="margin-top:16px">';
    p.players.forEach((pl,i)=>{
      const win=rv.winners.includes(i);
      h+=`<div class="reveal-row${win?' win':''}"><div class="nm">${win?'🏆 ':''}${esc(pl.name)}${rv.declarer===i?' <span class="shield">T</span>':''}</div><div class="cards">${(rv.hands[i]||[]).filter(c=>c).map(c=>cardHtml(c,{size:'sm'})).join('')||'<span class="muted">—</span>'}</div><div class="sc"><b style="color:${win?'#7EE29A':rv.scores[i]>=50?'#F08A8A':'var(--cream)'}">${rv.scores[i]>0?'+':''}${rv.scores[i]}</b><small>${t('g.pts',{n:pl.total})}</small></div></div>`;
    });
    h+=`</div><div class="grow"></div><p id="nextIn" class="muted" style="text-align:center"></p>`;
    if(isHost)h+=`<button class="btn btn-gold" onclick="api('next')">${p.gameOver?t('g.final'):t('g.next')}</button>`;
    ov.innerHTML=h;ov.classList.remove('hidden');
  }else if(p.status==='finished'&&p.standings){
    const w=p.standings[0];
    let h=`<div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:10px"><p class="muted" style="letter-spacing:2px;text-transform:uppercase">${t('g.finished')}</p>${avatar(p.players[w.i].name,72)}<h1 style="margin:14px 0 2px;font-family:var(--fd);font-weight:900;color:var(--gold2);letter-spacing:2px">${esc(p.players[w.i].name)}</h1><p style="margin:0;font-family:var(--fd);font-size:26px;color:var(--cream)">${w.total} <span class="muted">${t('pts')}</span></p></div><div style="margin-top:22px">`;
    p.standings.forEach((r,k)=>{const pl=p.players[r.i];h+=`<div class="reveal-row${k===0?' win':''}"><span style="width:20px;font-family:var(--fd);font-weight:700">${k+1}</span>${avatar(pl.name,26)}<div style="flex:1;font-weight:600">${esc(pl.name)}${r.i===me?' <span class="muted">('+t('lob.you')+')</span>':''}${pl.left?' <span class="muted">· '+t('g.left')+'</span>':''}</div><b style="font-family:var(--fd)">${r.total}</b></div>`});
    h+=`</div><div class="grow"></div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-gold" onclick="playAgain(${p.isPublic})">${t('g.playAgain')}</button><button class="btn btn-ghost" onclick="leaveOnline(true)">${t('g.backMenu')}</button></div>`;
    ov.innerHTML=h;ov.classList.remove('hidden');
    if(!ov.dataset.done){ov.dataset.done='1';if(me===w.i)buzz(300)}
  }else{ov.classList.add('hidden');ov.dataset.done=''}
}
async function playAgain(pub){unsubscribe();G=null;LS.del('onlineGame');lastEventId=0;if(pub)await quickMatch();else await createRoom()}
function openScoresModal(){
  if(!G)return;const p=G.pub;
  const rows=p.players.map((pl,i)=>({pl,i})).sort((a,b)=>a.pl.total-b.pl.total);
  let h='<div style="margin-top:10px">';
  rows.forEach(({pl,i},k)=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05)"><span style="width:18px;font-family:var(--fd);color:${k===0?'#D4A83A':'var(--faint)'}">${k+1}</span>${avatar(pl.name,24)}<span style="flex:1;font-weight:600;font-size:13px">${esc(pl.name)}</span><span class="muted" style="font-size:10px">${pl.rounds.join(' · ')}</span><b style="min-width:30px;text-align:right">${pl.total}</b></div>`});
  document.getElementById('scoresBody').innerHTML=h+'</div>';
  openModal('scoresModal');
}

// ---------- intro del estudio ----------
function endIntro(){const el=document.getElementById('intro');if(!el||el.dataset.done)return;if(el.classList.contains('wait'))return startIntro();el.dataset.done=1;el.classList.add('out');setTimeout(()=>{el.remove();sndUnlock()},600)}
function startIntro(){
  const el=document.getElementById('intro');if(!el||el.dataset.started)return;el.dataset.started=1;
  const c=sndInit();const go=()=>{el.classList.remove('wait');SND.unlocked=true;play('intro');setTimeout(endIntro,3300)};
  if(c&&c.state!=='running')c.resume().then(go,go);else go();
}
(function(){
  const el=document.getElementById('intro');if(!el)return;
  let seen=false;try{seen=sessionStorage.getItem('talmut.intro')==='1';sessionStorage.setItem('talmut.intro','1')}catch(e){}
  if(seen||location.hash.includes('access_token')){el.remove();return}
  const snip=['const deck = shuffle(cards);','if (talmut) lastRound();','sync(state, secret);','export function deal(n){','  return hand.map(c => c);','await save(game, v);','players.forEach(p => p.peek(2));','// SM42 · build 1.0','snap(card, 3000);','score += value(card);'];
  const mk=(side)=>{const d=document.createElement('div');d.className='code';d.style[side]=(4+Math.random()*10)+'%';d.style.top=(18+Math.random()*50)+'%';d.textContent=Array.from({length:4+Math.floor(Math.random()*4)},()=>snip[Math.floor(Math.random()*snip.length)]).join('\n');el.appendChild(d)};
  mk('left');mk('right');mk('right');
  for(let i=0;i<34;i++){const d=document.createElement('div');d.className='dot';d.style.left=Math.random()*100+'%';d.style.top=(15+Math.random()*70)+'%';d.style.animationDelay=(Math.random()*2.4)+'s';d.style.animationDuration=(1.8+Math.random()*2)+'s';el.appendChild(d)}
  // Si el móvil deja sonar sin tocar, arranca ya; si no, "toca para empezar" (para que se oiga el ¡PAM!)
  const c=sndInit();
  if(c&&c.state==='running')startIntro();
  else{el.classList.add('wait');setTimeout(()=>{if(el.classList.contains('wait')&&c&&c.state==='running')startIntro()},300)}
})();

refreshMenu();
refreshMuteIcon();
